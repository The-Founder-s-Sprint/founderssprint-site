<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Centre · Portals · The Founder's Sprint</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://ivedeivyotwevjxvcuoe.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#EFE7D8; --surface:#E6DCC7; --card:#EFE7D8; --ink:#1A1A1A; --ink-mid:#444; --muted:#5A564F;
    --border:rgba(26,26,26,0.18); --border-hi:rgba(26,26,26,0.35);
    --terra:#C8531F; --terra-deep:#9A3E16; --ochre:#C9923A; --ochre-deep:#A6741F; --sage:#8AAB5C; --moss:#3D4A2E; --stone:#A59B8C;
    --success:#0A8F64; --warning:#C47F08; --paper-mid:#C0B8A8; --text:#1A1A1A;
    --sans:'Josefin Sans',Inter,system-ui,sans-serif; --display:'Cormorant Garamond',serif; --font:'Inter',system-ui,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased;}
  .geo-line{height:1px;background:var(--border-hi);width:100%;}
  /* login */
  #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .login-card{background:#15161A;border:1px solid #2A2C33;border-top:2px solid var(--ochre);padding:52px 44px 44px;width:380px;color:#EDE7DA;}
  .login-eyebrow{font-family:var(--sans);font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--ochre);margin-bottom:4px;opacity:.9;}
  .login-title{font-size:28px;font-weight:700;line-height:1.1;margin-bottom:8px;color:#fff;}
  .login-rule{display:flex;gap:10px;margin:4px 0 32px;} .login-rule .geo-line{background:#33353D;}
  .login-input{width:100%;background:#1F2127;border:1px solid #33353D;color:#EDE7DA;padding:12px 14px;font-size:14px;font-family:var(--font);margin-bottom:10px;outline:none;}
  .login-input:focus{border-color:var(--ochre);}
  .btn-login{width:100%;background:var(--ochre);color:#15161A;border:none;padding:13px;font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;margin-top:6px;}
  .btn-login:hover{background:var(--ochre-deep);color:#fff;} .btn-login:disabled{opacity:.5;}
  .login-error{color:#E2685A;font-size:12px;min-height:16px;margin-top:10px;}
  /* app */
  #app{display:none;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:#15161A;color:#EDE7DA;position:sticky;top:0;z-index:50;}
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .topbar-mark svg{width:26px;height:26px;display:block;}
  .topbar-logo{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#fff;}
  .topbar-sep{width:1px;height:18px;background:#33353D;}
  .topbar-sub{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ochre);}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .topbar-user{font-size:12px;color:#A8A498;}
  .btn-ghost{background:none;color:var(--ochre);border:1px solid #3A3C44;padding:8px 14px;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;}
  .btn-ghost:hover{background:rgba(201,146,58,.12);}
  /* tabs */
  .tabs{display:flex;gap:0;background:#1B1C21;padding:0 28px;overflow-x:auto;}
  .tab{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#9A968C;padding:14px 18px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:8px;}
  .tab:hover{color:#EDE7DA;}
  .tab.active{color:#fff;border-bottom-color:var(--ochre);}
  .tab .cnt{font-family:var(--font);font-size:10px;font-weight:700;background:rgba(201,146,58,.18);color:var(--ochre);padding:2px 7px;border-radius:9px;}
  .main{max-width:1180px;margin:0 auto;padding:30px 28px 80px;}
  .page-eyebrow{font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ochre-deep);margin-bottom:6px;}
  .page-title{font-family:var(--display);font-size:32px;font-weight:600;line-height:1.05;margin-bottom:6px;}
  .page-sub{font-size:14px;color:var(--muted);margin-bottom:22px;max-width:680px;line-height:1.5;}
  /* stat chips */
  .stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
  .stat{background:var(--card);border:1px solid var(--border);border-top:2px solid var(--ochre);padding:12px 18px;min-width:120px;}
  .stat .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1;}
  .stat .l{font-family:var(--sans);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:5px;}
  /* search */
  .search{width:100%;max-width:340px;background:rgba(0,0,0,.03);border:1px solid var(--border);padding:10px 13px;font-size:13px;font-family:var(--font);outline:none;margin-bottom:14px;}
  .search:focus{border-color:var(--ochre);}
  /* table */
  .tbl-wrap{background:var(--card);border:1px solid var(--border);overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 16px;border-bottom:1px solid var(--border-hi);white-space:nowrap;}
  td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.row:hover td{background:rgba(201,146,58,.06);}
  .nm{font-weight:600;font-size:13px;}
  .sub{color:var(--muted);font-size:11.5px;}
  .pill{font-family:var(--sans);font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:2px;display:inline-block;}
  .pill-green{background:rgba(10,143,100,.14);color:var(--success);} .pill-grey{background:rgba(26,26,26,.07);color:var(--muted);}
  .pill-ochre{background:rgba(201,146,58,.16);color:var(--ochre-deep);} .pill-terra{background:rgba(200,83,31,.14);color:var(--terra);}
  .pill-red{background:rgba(220,53,69,.13);color:#C0392B;}
  .tag{display:inline-block;font-family:var(--sans);font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border:1px solid var(--border-hi);color:var(--ink-mid);margin:1px 3px 1px 0;border-radius:2px;}
  .tag.lead{border-color:var(--ochre);color:var(--ochre-deep);background:rgba(201,146,58,.08);}
  .empty{text-align:center;padding:50px 20px;color:var(--muted);}
  .deny{max-width:460px;margin:80px auto;text-align:center;color:var(--muted);}
  .deny .m{font-family:var(--display);font-size:30px;color:var(--border-hi);margin-bottom:10px;}
  #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:13px 22px;font-size:13px;opacity:0;transition:all .3s;z-index:2000;}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1;} #toast.error{background:#DC3545;}
  /* Coaches portal hub */
  .subtabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;}
  .subtab{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;}
  .subtab.active{color:var(--ochre-deep);border-bottom-color:var(--ochre);}
  .disc-group{margin-bottom:22px;}
  .disc-group-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ochre);padding-bottom:6px;margin-bottom:6px;}
  .disc-group-h span:first-child{font-family:var(--display);font-size:19px;font-weight:600;}
  .coach-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border);}
  .coach-row:last-child{border-bottom:none;}
  .avatar-sm{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border-hi);overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:15px;color:var(--muted);flex-shrink:0;}
  .avatar-sm img{width:100%;height:100%;object-fit:cover;}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .kv .k{font-family:var(--sans);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
  .kv .v{font-size:13px;font-weight:500;}
  .app-card{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--ochre);padding:16px 18px;margin-bottom:14px;}
  .app-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px;}
  .dd{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border-hi);}
  .app-actions{margin-top:14px;display:flex;gap:8px;}
  .btn-sm{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;border:none;cursor:pointer;}
  .btn-sm.approve{background:var(--success);color:#fff;} .btn-sm.reject{background:none;color:#C0392B;border:1px solid var(--border-hi);}
  .mat-coach{margin:8px 0 12px;} .mat-coach-h{font-size:12px;font-weight:600;color:var(--ink-mid);margin:6px 0 2px;}
  .mat-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--border);font-size:12.5px;}
  .app-card select,.app-card input{width:100%;background:var(--bg);border:1px solid var(--border);padding:8px 10px;font-size:13px;font-family:var(--font);color:var(--text);}
  .app-card select:focus,.app-card input:focus{outline:none;border-color:var(--ochre);}
  @media(max-width:560px){.main{padding:22px 16px 70px;}.page-title{font-size:26px;}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-eyebrow">The Founder's Sprint</div>
    <div class="login-title">Command Centre</div>
    <div class="login-rule"><div class="geo-line"></div></div>
    <input class="login-input" type="email" id="login-email" placeholder="Email address" autocomplete="email">
    <input class="login-input" type="password" id="login-password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')signIn()">
    <button class="btn-login" onclick="signIn()">Enter</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-mark"><svg viewBox="0 0 100 100"><polygon points="50,8 57,50 50,92 43,50" fill="#C8531F" opacity="0.85"/><polygon points="50,8 57,50 50,92 43,50" fill="#C9923A" opacity="0.8" transform="rotate(72,50,50)"/><polygon points="50,8 57,50 50,92 43,50" fill="#8AAB5C" opacity="0.78" transform="rotate(144,50,50)"/><polygon points="50,8 57,50 50,92 43,50" fill="#3D4A2E" opacity="0.82" transform="rotate(216,50,50)"/><polygon points="50,8 57,50 50,92 43,50" fill="#777770" opacity="0.75" transform="rotate(288,50,50)"/><circle cx="50" cy="50" r="4.5" fill="#15161A"/><circle cx="50" cy="50" r="2" fill="#fff"/></svg></div>
      <span class="topbar-logo">Founder's Sprint</span>
      <div class="topbar-sep"></div><span class="topbar-sub">Command Centre</span>
    </div>
    <div class="topbar-right">
      <a class="btn-ghost" href="/dashboard.html" title="Operations dashboard — cohorts, registrations, revenue" style="text-decoration:none">↩ Ops dashboard</a>
      <span class="topbar-user" id="user-email"></span>
      <button class="btn-ghost" onclick="signOut()">Sign Out</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="main">
    <div class="page-eyebrow">Super-admin · all portals</div>
    <div class="page-title" id="portal-title">Portals</div>
    <div class="page-sub" id="portal-sub"></div>
    <div class="stat-row" id="stat-row"></div>
    <input class="search" id="search" placeholder="Search…" oninput="onSearchInput()">
    <div id="roster"></div>
  </div>
</div>
<div id="toast"></div>

<script>
const SUPABASE_URL='https://ivedeivyotwevjxvcuoe.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2ZWRlaXZ5b3R3ZXZqeHZjdW9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxOTk1OTIsImV4cCI6MjA5MDc3NTU5Mn0.qMqjTMDRcvuuSy0yXLPH-yZpWFZdUv63enAsEWxzsss';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{detectSessionInUrl:true,autoRefreshToken:true,persistSession:true}});

const DISC_LABEL={marketing:'Marketing & Branding',financial:'Financial Modelling',investment:'Investment Readiness',strategy:'Strategy & Team',product:'Product Dev & Pricing'};
const TRACK_LABEL={single:'1:1 Session',pick3:'Pick 3 Bundle',cohort:'Full Cohort',group:'Full Cohort',vip1on1:'VIP 1:1',vip:'VIP Track'};

// ── auth layer (Safari-safe) ──
const _SB_KEY='sb-'+SUPABASE_URL.split('//')[1].split('.')[0]+'-auth-token';
let _rp=null,currentSession=null,booted=false;
function _stored(){try{return JSON.parse(localStorage.getItem(_SB_KEY)||'{}');}catch{return{};}}
function _exp(s){const e=s.expires_at;return !e||(Date.now()/1000)>(e-60);}
async function _refresh(){if(_rp)return _rp;_rp=(async()=>{const s=_stored();if(!s.refresh_token)throw new Error('Please sign in again');
  const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_ANON,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
  if(!r.ok){localStorage.removeItem(_SB_KEY);throw new Error('Session expired');}const j=await r.json();localStorage.setItem(_SB_KEY,JSON.stringify(j));currentSession=j;return j.access_token;})();
  try{return await _rp;}finally{_rp=null;}}
async function _token(){if(currentSession?.access_token){const e=currentSession.expires_at;if(e&&(Date.now()/1000)<(e-60))return currentSession.access_token;}
  const s=_stored();if(s.access_token&&!_exp(s))return s.access_token;return _refresh();}
async function _q(table,params){const t=await _token();const r=await fetch(SUPABASE_URL+'/rest/v1/'+table+'?'+params,{headers:{apikey:SUPABASE_ANON,Authorization:'Bearer '+t}});
  if(!r.ok)throw new Error('Query failed '+r.status+': '+await r.text());return r.json();}
async function _w(method,table,params,body,extra){const t=await _token();const r=await fetch(SUPABASE_URL+'/rest/v1/'+table+(params?('?'+params):''),{method,headers:Object.assign({apikey:SUPABASE_ANON,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:'return=representation'},extra||{}),body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error('Write failed '+r.status+': '+await r.text());const x=await r.text();return x?JSON.parse(x):null;}
async function _rpc(fn,args){const t=await _token();const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SUPABASE_ANON,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  if(!r.ok)throw new Error('RPC '+r.status+': '+await r.text());const x=await r.text();return x?JSON.parse(x):null;}

async function signIn(){
  const email=document.getElementById('login-email').value.trim();
  const pw=document.getElementById('login-password').value;
  const err=document.getElementById('login-error');const btn=document.querySelector('.btn-login');err.textContent='';
  if(!email||!pw){err.textContent='Enter email and password';return;}
  try{btn.disabled=true;btn.textContent='Signing in…';
    const{error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error){err.textContent=error.message;}
  }catch(e){err.textContent=e.message;}finally{btn.disabled=false;btn.textContent='Enter';}
}
function signOut(){localStorage.removeItem(_SB_KEY);try{sb.auth.signOut().catch(()=>{});}catch(e){}location.reload();}

sb.auth.onAuthStateChange((ev,s)=>{ currentSession=s; if((ev==='SIGNED_IN'||ev==='TOKEN_REFRESHED'||ev==='INITIAL_SESSION') && s && !booted) boot(s.user); });
let _redir=false; function _toLogin(){ if(_redir||booted) return; _redir=true; location.replace('/login-admin.html'); }
// Authoritative session check: getSession() validates + refreshes, or returns null for a stale/absent token.
(async()=>{
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(session){ currentSession=session; if(!booted) boot(session.user); }
    else { _toLogin(); }
  }catch(e){ _toLogin(); }
})();

// ── state ──
let founders=[], pageCompanies=[], pageRegs=[], coaches=[], topics=[], roles=[];
let applications=[], materials=[], presentations=[], invFirms=[], invMembers=[];
let active='founders', coachSub='roster';
// ── server-side pagination (unbounded-growth tables: founders, firms) ──
const PAGE=25;
let fState={page:0,total:0}, fStatCounts=null;          // founders
let iState={page:0,total:0}, iStatCounts=null;          // investor firms
let portalCounts={founders:0,coaches:0,investors:0,admins:0};
let _searchTimer=null;
function onSearchInput(){ clearTimeout(_searchTimer); _searchTimer=setTimeout(()=>{ fState.page=0; iState.page=0; renderActive(); }, 300); }
async function pagedFetch(table, params){
  const t=await _token();
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+table+'?'+params,{headers:{apikey:SUPABASE_ANON,Authorization:'Bearer '+t,Prefer:'count=exact'}});
  if(!r.ok) throw new Error('Query failed '+r.status+': '+await r.text());
  const rows=await r.json();
  const cr=r.headers.get('content-range')||''; const tot=cr.includes('/')?parseInt(cr.split('/')[1],10):rows.length;
  return { rows, total: isNaN(tot)?rows.length:tot };
}
async function countOnly(table, filter){
  try{ const t=await _token();
    const r=await fetch(SUPABASE_URL+'/rest/v1/'+table+'?select=id&limit=1'+(filter?('&'+filter):''),{headers:{apikey:SUPABASE_ANON,Authorization:'Bearer '+t,Prefer:'count=exact'}});
    const cr=r.headers.get('content-range')||''; const tot=cr.includes('/')?parseInt(cr.split('/')[1],10):0; return isNaN(tot)?0:tot;
  }catch(e){ return 0; }
}
function pager(state, fn){
  const pages=Math.max(1,Math.ceil(state.total/PAGE)), cur=state.page+1;
  if(state.total<=PAGE) return '<div class="sub" style="margin-top:12px">'+state.total+' total</div>';
  return '<div style="display:flex;align-items:center;gap:12px;margin-top:16px">'
    +'<button class="btn-sm" style="background:none;border:1px solid var(--border-hi);color:var(--ink-mid)" '+(state.page<=0?'disabled':'')+' onclick="'+fn+'(-1)">‹ Prev</button>'
    +'<span class="sub">Page '+cur+' of '+pages+' · '+state.total+' total</span>'
    +'<button class="btn-sm" style="background:none;border:1px solid var(--border-hi);color:var(--ink-mid)" '+(cur>=pages?'disabled':'')+' onclick="'+fn+'(1)">Next ›</button></div>';
}
function foundersPage(d){ fState.page=Math.max(0,fState.page+d); loadFounders(); }
function investorsPage(d){ iState.page=Math.max(0,iState.page+d); loadInvestors(); }
function searchVal(){ return (document.getElementById('search').value||'').trim(); }
// Build a safe PostgREST ilike-OR filter. encodeURIComponent leaves ()*!' unencoded, and PostgREST
// treats , ( ) . as filter syntax + % * as wildcards — so strip those from user input before building the filter.
function ilikeOr(cols,q){
  let clean=String(q||'').replace(/[(),.*%"'!~\\ -]/g,' ').replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?:^|[^\uD800-\uDBFF])[\uDC00-\uDFFF]/g,' ').trim();
  if(!clean) return '';
  let e; try{ e=encodeURIComponent('*'+clean+'*'); } catch(_){ return ''; }
  return 'or=('+cols.map(c=>c+'.ilike.'+e).join(',')+')';
}
// ── scoped roles ──
let myRoles=[];
const STAFF_ROLES=['admin','coach_support','investor_support','founder_support','finance','hub_partner'];
const ROLE_LABEL={admin:'Super admin',coach_support:'Coach support',investor_support:'Investor support',founder_support:'Founder support',finance:'Finance',hub_partner:'Partner'};
function hasR(r){ return myRoles.includes(r); }
function isSuper(){ return hasR('admin'); }
function canDD(){ return isSuper()||hasR('finance'); }                 // see ID/CV/payout + final approve
function canFinance(){ return isSuper()||hasR('finance'); }            // money: payment overrides
function canCoachMgmt(){ return isSuper()||hasR('coach_support')||hasR('finance'); }
function canFounderMgmt(){ return isSuper()||hasR('founder_support')||hasR('finance'); }
function canInvestorMgmt(){ return isSuper()||hasR('investor_support')||hasR('finance'); }
// which portals a role may open
function canSeePortal(k){
  if(isSuper()) return true;
  if(k==='founders')  return hasR('founder_support')||hasR('finance');
  if(k==='coaches')   return hasR('coach_support')||hasR('finance');
  if(k==='investors') return hasR('investor_support')||hasR('finance');
  if(k==='admins')    return false; // super-admin only
  return false;
}

async function boot(user){
  if(booted||!user)return; booted=true;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('user-email').textContent=user.email;
  try{
    const me=await _q('user_roles','user_id=eq.'+user.id+'&select=role');
    myRoles=(me||[]).map(r=>r.role);
    if(!STAFF_ROLES.some(r=>myRoles.includes(r))){
      document.querySelector('.tabs').style.display='none';
      document.getElementById('stat-row').style.display='none';
      document.getElementById('search').style.display='none';
      document.getElementById('portal-title').textContent='Access restricted';
      document.getElementById('portal-sub').textContent='';
      document.getElementById('roster').innerHTML='<div class="deny"><div class="m">◇</div><div style="font-weight:600;color:var(--ink-mid)">This account has no Command Centre access</div><div style="margin-top:6px">Ask a super-admin to grant you a staff role.</div></div>';
      return;
    }
    // Bounded reference data loaded once (coaches ≤ ~1k, applications pipeline, per-coach materials/seats).
    // Founders + investor firms are UNBOUNDED → loaded per-page server-side, never in bulk.
    const r=await Promise.allSettled([
      _q('coaches','select=*&order=created_at&limit=2000'),
      _q('coach_topics','select=coach_id,discipline_key,is_lead&limit=5000'),
      _q('coach_applications','select=*&order=created_at.desc&limit=500'),
      _q('course_materials','select=id,coach_id,title,discipline,module_type,format,status,is_active,file_path,source_url&order=sort_order&limit=2000'),
      _q('coach_presentations','select=id,coach_id,title,taxonomy_l1,is_active,file_path&order=sort_order&limit=2000'),
      _q('investor_members','select=*&limit=2000')
    ]);
    coaches  =r[0].status==='fulfilled'?(r[0].value||[]):[];
    topics   =r[1].status==='fulfilled'?(r[1].value||[]):[];
    applications =r[2].status==='fulfilled'?(r[2].value||[]):[];
    materials    =r[3].status==='fulfilled'?(r[3].value||[]):[];
    presentations=r[4].status==='fulfilled'?(r[4].value||[]):[];
    invMembers   =r[5].status==='fulfilled'?(r[5].value||[]):[];
    // server-side counts for tab badges (no full-table loads)
    portalCounts.founders  = await countOnly('founder_profiles','');
    portalCounts.investors = await countOnly('investor_firms','');
    portalCounts.coaches   = coaches.length;
    portalCounts.admins    = await countOnly('user_roles',"role=in.(admin,hub_partner)");
    const firstPortal=PORTALS.find(p=>canSeePortal(p.key));
    renderTabs(); switchPortal(firstPortal?firstPortal.key:'founders');
  }catch(e){ showToast('Could not load — '+e.message,'error'); }
}

function counts(){ return portalCounts; }
function renderTabs(){
  const c=counts();
  document.getElementById('tabs').innerHTML=PORTALS.filter(p=>canSeePortal(p.key)).map(p=>

function switchPortal(k){ active=k; document.getElementById('search').value=''; renderTabs();

function match(q,...fields){ q=q.trim().toLowerCase(); if(!q)return true; return fields.some(f=>String(f||'').toLowerCase().includes(q)); }
function tbl(headers,rows){
  if(!rows.length) return '<div class="tbl-wrap"><div class="empty">No matching records.</div></div>';
  return '<div class="tbl-wrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
}
function stats(items){ document.getElementById('stat-row').innerHTML=items.map(i=>'<div class="stat"><div class="v">'+i.v+'</div><div class="l">'+i.l+'</div></div>').join(''); }

function renderActive(){
  const q=searchVal();
  if(active==='founders')  loadFounders();

  else if(active==='investors') loadInvestors();
  else renderAdmins(q);
}

function companiesOf(fid){ return pageCompanies.filter(c=>c.founder_id===fid); }
function regOf(f){ return pageRegs.find(r=>r.founder_id===f.id || (f.user_id && r.user_id===f.user_id) || (r.email&&f.email&&r.email.toLowerCase()===f.email.toLowerCase())); }
function regsForFounder(f){ return pageRegs.filter(r=>r.founder_id===f.id || (f.user_id&&r.user_id===f.user_id) || (r.email&&f.email&&r.email.toLowerCase()===f.email.toLowerCase())); }

// ── Founders: server-side paginated (unbounded table) ──
async function loadFounders(){
  const q=searchVal();
  let params='select=*&order=created_at.desc&limit='+PAGE+'&offset='+(fState.page*PAGE);
  const sf=ilikeOr(['first_name','last_name','email','company_name'],q); if(sf) params+='&'+sf;
  document.getElementById('roster').innerHTML='<div class="empty">Loading…</div>';
  try{
    const {rows,total}=await pagedFetch('founder_profiles',params);
    founders=rows; fState.total=total;
    const ids=rows.map(r=>r.id), uids=rows.map(r=>r.user_id).filter(Boolean);
    pageCompanies = ids.length ? await _q('companies','founder_id=in.('+ids.join(',')+')&select=id,founder_id,name,sector,data_room_shared,investor_visible&limit=500') : [];
    pageRegs = (ids.length||uids.length)
      ? await _q('registrations','or=(founder_id.in.('+(ids.join(',')||'0')+'),user_id.in.('+(uids.join(',')||'00000000-0000-0000-0000-000000000000')+'))&select=id,founder_id,user_id,email,track,deposit_paid,balance_paid,forfeited&limit=500')
      : [];
    // headline counts (cached after first fetch; don't recount per page)
    if(!fStatCounts){ fStatCounts={
      companies: await countOnly('companies',''),
      visible:   await countOnly('founder_profiles','investor_visible=eq.true') }; }
    stats([{v:fState.total,l:'Founders'},{v:fStatCounts.companies,l:'Companies'},{v:fStatCounts.visible,l:'Investor-visible'}]);
    renderFoundersTable();
  }catch(e){ document.getElementById('roster').innerHTML=tbl(['Founder'],[]); showToast('Could not load founders — '+e.message,'error'); }
}
function renderFoundersTable(){
  const rows=founders.map(f=>{
    const cos=companiesOf(f.id), r=regOf(f);
    const coNames=cos.length?cos.map(c=>esc(c.name)+(c.data_room_shared?' <span class="pill pill-ochre">shared</span>':'')).join('<br>'):(f.company_name?esc(f.company_name):'<span class="sub">—</span>');
    const track=r&&r.track?TRACK_LABEL[r.track]||r.track:'—';
    let pay='<span class="pill pill-grey">No booking</span>';
    if(r){ if(r.forfeited)pay='<span class="pill pill-red">Forfeited</span>';
      else if(r.deposit_paid&&r.balance_paid)pay='<span class="pill pill-green">Fully paid</span>';
      else if(r.deposit_paid)pay='<span class="pill pill-terra">Balance due</span>';
      else pay='<span class="pill pill-grey">Unpaid</span>'; }
    const archived=f.status==='archived';
    const actCell=canFounderMgmt()?'<button class="btn-sm" style="background:none;border:1px solid var(--border-hi);color:var(--ink-mid);padding:5px 10px" onclick="editFounder(\''+f.id+'\')">Manage</button>':'';
    return '<tr class="row"'+(archived?' style="opacity:.55"':'')+'><td><div class="nm">'+esc((f.first_name||'')+' '+(f.last_name||''))+(archived?' <span class="pill pill-grey">archived</span>':'')+'</div><div class="sub">'+esc(f.email||'')+'</div></td>'
      +'<td>'+coNames+'</td><td>'+esc(f.sector||(cos[0]&&cos[0].sector)||'—')+'</td><td>'+esc(track)+'</td><td>'+pay+'</td><td>'+actCell+'</td></tr>';
  });
  document.getElementById('roster').innerHTML=tbl(['Founder','Company','Sector','Track','Payment','Manage'],rows)+pager(fState,'foundersPage');
}

      : '<span class="pill '+(r.balance_paid?'pill-green':'pill-grey')+'">Balance '+(r.balance_paid?'paid':'—')+'</span>';

    +'<div class="app-card"><div class="app-head"><div><span class="nm">'+esc((f.first_name||'')+' '+(f.last_name||''))+'</span> <span class="sub">'+esc(f.email||'')+'</span></div></div>'
    +'<div class="sub" style="margin:6px 0 14px">Administrative controls — you manage account state and payments; you don\'t rewrite the founder\'s own data-room content.</div>'
    +'<div class="kv">'
      +'<div><div class="k">Account status</div><select id="ef-status"><option value="active"'+(f.status!=='archived'?' selected':'')+'>Active</option><option value="archived"'+(f.status==='archived'?' selected':'')+'>Archived</option></select></div>'
      +'<div><div class="k">Investor visibility (moderation)</div><select id="ef-vis"><option value="on"'+(vis?' selected':'')+'>Visible to investors</option><option value="off"'+(!vis?' selected':'')+'>Hidden</option></select></div>'
    +'</div>'
    +'<div class="f" style="margin-top:12px"><div class="k">Admin note</div><textarea id="ef-note" rows="2" style="width:100%">'+esc(f.admin_notes||'')+'</textarea></div>'
    +'<div style="margin-top:14px"><button class="btn-sm approve" onclick="saveFounder(\''+fid+'\')">Save</button></div>'
    +'<div class="section-title" style="margin:18px 0 6px;font-size:10px">Payments (manual override)</div>'+payRows
    +'<div class="sub" style="margin-top:8px;font-size:11px">Use overrides only for confirmed off-platform payments; ioTec reconciliation sets these automatically once live.</div>'

async function saveFounder(fid){
  const f=founders.find(x=>x.id===fid); if(!f) return;
  const status=document.getElementById('ef-status').value;
  const vis=document.getElementById('ef-vis').value==='on';
  const note=document.getElementById('ef-note').value.trim()||null;
  try{
    await _w('PATCH','founder_profiles','id=eq.'+fid,{status,investor_visible:vis,data_room_shared:vis,admin_notes:note,updated_at:new Date().toISOString()});
    f.status=status; f.investor_visible=vis; f.admin_notes=note;
    showToast('Founder account updated','success'); loadFounders();
  }catch(e){ showToast('Could not save — '+e.message,'error'); }
}
async function setPay(regId,field,val){
  try{ const body={}; body[field]=val; body.updated_at=new Date().toISOString();
    await _w('PATCH','registrations','id=eq.'+regId,body);
    const r=pageRegs.find(x=>x.id===regId); if(r)r[field]=val;
    showToast('Payment updated','success');
    // re-open the founder editor to reflect
    const f=founders.find(x=>regsForFounder(x).some(rr=>rr.id===regId)); if(f) editFounder(f.id);
  }catch(e){ showToast('Could not update — '+e.message,'error'); }
}

function discsOf(cid){ return topics.filter(t=>t.coach_id===cid); }
function coachesInDiscipline(key){ const ids=topics.filter(t=>t.discipline_key===key).map(t=>t.coach_id); return coaches.filter(c=>ids.includes(c.id)); }
function isLeadOf(c,key){ return topics.some(t=>t.coach_id===c.id&&t.discipline_key===key&&t.is_lead); }
function appsPending(){ return applications.filter(a=>a.review_stage==='lead_review'||a.review_stage==='admin_review').length; }

// ── Coaches Portal: the single coach-management hub (roster · applications · materials) ──
function renderCoaches(q){
  const active_=coaches.filter(c=>c.status==='active').length;
  const leads=topics.filter(t=>t.is_lead).length;
  stats([{v:coaches.length,l:'Coaches'},{v:active_,l:'Active'},{v:leads,l:'Discipline leads'},{v:appsPending(),l:'Applications in review'}]);
  const subs=[['roster','Roster'],['applications','Applications'+(appsPending()?' ('+appsPending()+')':'')],['materials','Materials']];
  document.getElementById('roster').innerHTML='<div class="subtabs">'
    + subs.map(s=>'<span class="subtab'+(coachSub===s[0]?' active':'')+'" onclick="setCoachSub(\''+s[0]+'\')">'+s[1]+'</span>').join('')
    + '</div><div id="coach-sub"></div>';

}
function setCoachSub(k){ coachSub=k; renderCoaches(document.getElementById('search').value); }
function renderCoachSub(q){ if(coachSub==='applications') renderCoachApplications(q); else if(coachSub==='materials') renderCoachMaterials(q); else renderCoachRoster(q); }

function coachRow(c,key,lead){
  const fee=c.session_fee?'UGX '+Number(c.session_fee).toLocaleString('en-US'):'—';
  const st=c.status==='active'?'<span class="pill pill-green">Active</span>':'<span class="pill pill-grey">'+esc(c.status||'—')+'</span>';
  const av=c.avatar_url?'<img src="'+esc(c.avatar_url)+'">':esc(((c.first_name||'?')[0]||'?').toUpperCase());
  const edit=canCoachMgmt()?'<button class="btn-sm" style="background:none;border:1px solid var(--border-hi);color:var(--ink-mid);padding:5px 10px" onclick="editCoach('+c.id+',\''+key+'\')">Edit</button>':'';
  return '<div class="coach-row" id="coach-row-'+c.id+'"><div class="avatar-sm">'+av+'</div>'
    +'<div style="flex:1;min-width:0"><div class="nm">'+esc((c.first_name||'')+' '+(c.last_name||''))+(lead?' <span class="tag lead">Discipline Lead</span>':'')+'</div>'
    +'<div class="sub">'+esc(c.headline||c.email||c.founderssprint_email||'')+'</div></div>'
    +'<div style="text-align:right;flex-shrink:0;display:flex;align-items:center;gap:10px"><div>'+st+'<div class="sub" style="margin-top:4px">'+fee+'</div></div>'+edit+'</div></div>';

function renderCoachRoster(q){
  const html=DISC_ORDER.map(key=>{
    const col=DISC_COLOR[key]||'var(--ochre)';
    const list=coachesInDiscipline(key).filter(c=>match(q,c.first_name,c.last_name,c.email,c.headline));
    const ordered=[...list.filter(c=>isLeadOf(c,key)), ...list.filter(c=>!isLeadOf(c,key))];
    const body=ordered.length?ordered.map(c=>coachRow(c,key,isLeadOf(c,key))).join('')
      :'<div class="sub" style="padding:14px 4px">Lead: '+esc(DISC_LEAD[key])+' · no specialty coaches admitted yet.</div>';
    return '<div class="disc-group" style="border-left:3px solid '+col+';padding-left:14px"><div class="disc-group-h" style="border-bottom-color:'+col+'"><span style="color:'+col+'">'+esc(DISC_LABEL[key])+'</span>'
      +'<span class="sub">'+ordered.length+' coach'+(ordered.length===1?'':'es')+'</span></div>'+body+'</div>';
  }).join('');
  document.getElementById('coach-sub').innerHTML=html;
}

  const lead=isLeadOf(c,key);
  row.innerHTML='<div style="flex:1"><div class="nm" style="margin-bottom:8px">'+esc((c.first_name||'')+' '+(c.last_name||''))+' — '+esc(DISC_LABEL[key]||key)+'</div>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">'

async function saveCoach(cid,key){
  const status=document.getElementById('ec-status-'+cid).value;
  const fee=parseInt(document.getElementById('ec-fee-'+cid).value,10);
  const lead=document.getElementById('ec-lead-'+cid).checked;
  try{
    await _w('PATCH','coaches','id=eq.'+cid,{status,session_fee:isNaN(fee)?null:fee,updated_at:new Date().toISOString()});
    const c=coaches.find(x=>x.id===cid); if(c){c.status=status;c.session_fee=fee;}
    // sync lead flag on this discipline's coach_topics row
    const t=topics.find(x=>x.coach_id===cid&&x.discipline_key===key);
    if(t && t.is_lead!==lead){ await _w('PATCH','coach_topics','coach_id=eq.'+cid+'&discipline_key=eq.'+key,{is_lead:lead}); t.is_lead=lead; }
    showToast('Coach updated','success'); renderCoaches(document.getElementById('search').value);
  }catch(e){ showToast('Could not save — '+e.message,'error'); }
}
async function removeCoachFromDiscipline(cid,key){
  if(!confirm('Remove this coach from '+(DISC_LABEL[key]||key)+'? Their coverage of this discipline is removed (the coach account stays).'))return;
  try{ await _w('DELETE','coach_topics','coach_id=eq.'+cid+'&discipline_key=eq.'+key);
    topics=topics.filter(t=>!(t.coach_id===cid&&t.discipline_key===key));
    showToast('Removed from discipline','success'); renderCoaches(document.getElementById('search').value);
  }catch(e){ showToast('Could not remove — '+e.message,'error'); }
}

async function saveMaterial(){
  const coach_id=document.getElementById('m-coach').value;
  const discipline=document.getElementById('m-disc').value;
  const title=document.getElementById('m-title').value.trim();
  const type=document.getElementById('m-type').value;
  const status=document.getElementById('m-status').value;
  let source_url=document.getElementById('m-url').value.trim()||null;
  const file=document.getElementById('m-file').files[0];
  if(!coach_id){ showToast('Pick a coach with a login account','error'); return; }
  if(!title){ showToast('Add a title','error'); return; }
  const btn=document.getElementById('m-save'); btn.disabled=true; btn.textContent='Saving…';
  try{
    let file_path=null;
    if(file){
      const path=coach_id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      const t=await _token();
      const up=await fetch(SUPABASE_URL+'/storage/v1/object/course-materials/'+encodeURI(path),{method:'POST',headers:{apikey:SUPABASE_ANON,Authorization:'Bearer '+t,'x-upsert':'true','Content-Type':file.type||'application/octet-stream'},body:file});
      if(!up.ok) throw new Error('upload '+up.status); file_path=path;
    }
    const row=await _w('POST','course_materials','',{coach_id,title,discipline,module_type:type,format:type,source_url,file_path,status,is_active:true,created_at:new Date().toISOString(),updated_at:new Date().toISOString()});
    if(row&&row[0]) materials.unshift(row[0]);
    showToast('Material added','success'); renderCoaches(document.getElementById('search').value);
  }catch(e){ showToast('Could not save — '+e.message,'error'); } finally{ btn.disabled=false; }
}

    +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input id="gr-email" type="email" placeholder="email@…" style="flex:1;min-width:200px">'
    +'<select id="gr-role" style="width:auto">'+STAFF_ROLES.map(r=>'<option value="'+r+'">'+ROLE_LABEL[r]+'</option>').join('')+'</select>'
    +'<button class="btn-sm approve" onclick="grantRole()">Grant</button></div></div>' : '';
  const rows=all.filter(s=>match(q,s.email,(s.roles||[]).join(' '))).map(s=>{
    const chips=(s.roles||[]).map(r=>'<span class="tag'+(r==='admin'?' lead':'')+'">'+esc(ROLE_LABEL[r]||r)
      +(isSuper()?' <a href="#" title="Revoke" onclick="revokeRole(\''+s.user_id+'\',\''+r+'\');return false" style="color:#C0392B;text-decoration:none;font-weight:700">×</a>':'')+'</span>').join('');
    return '<tr class="row"><td><div class="nm">'+esc(s.email||'—')+'</div></td><td>'+chips+'</td></tr>';
  });
  document.getElementById('roster').innerHTML = grant + tbl(['Account','Roles'],rows)
    + '<div class="page-sub" style="margin-top:16px;font-size:12.5px"><b>What each role can do:</b> <b>Super admin</b> — everything, incl. role management. <b>Finance</b> — payments/pricing, sees payout/bank, final coach approval. <b>Coach support</b> — coaches, applications (suitability only), materials. <b>Investor support</b> — investors. <b>Founder support</b> — founder accounts. <b>Hub partner</b> — partner cohorts.</div>';
}
async function grantRole(){
  const email=document.getElementById('gr-email').value.trim(); const role=document.getElementById('gr-role').value;
  if(!email){ showToast('Enter an email','error'); return; }
  try{ await _rpc('admin_grant_role',{p_email:email,p_role:role}); showToast('Role granted','success'); staffDir=null; renderAdmins(''); }
  catch(e){ showToast('Could not grant — '+(e.message||'').replace(/^RPC \d+: /,''),'error'); }
}
async function revokeRole(uid,role){
  if(!confirm('Revoke '+(ROLE_LABEL[role]||role)+'?'))return;
  try{ await _rpc('admin_revoke_role',{p_user:uid,p_role:role}); showToast('Role revoked','success'); staffDir=null; renderAdmins(''); }
  catch(e){ showToast('Could not revoke — '+(e.message||'').replace(/^RPC \d+: /,''),'error'); }
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function showToast(m,t){const e=document.getElementById('toast');e.textContent=m;e.className=t||'';e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3200);}
</script>
</body>
</html>
