<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Founder's Sprint — Build with direction.</title>
  <meta name="description" content="Five expert coaching disciplines. One intensive sprint. The structured path from idea to investor-ready startup — built for East African founders.">

  <!-- Open Graph -->
  <meta property="og:title"       content="The Founder's Sprint">
  <meta property="og:description" content="Five expert coaches. One intensive sprint. Build with direction.">
  <meta property="og:type"        content="website">
  <meta property="og:url"         content="https://founderssprint.co">

  <!-- Twitter / X -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="The Founder's Sprint">
  <meta name="twitter:description" content="Five expert coaches. One intensive sprint. Build with direction.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:        #1A1A1A;
      --ink-soft:   #2A2826;
      --ink-mute:   #5A564F;
      --paper:      #EFE7D8;
      --paper-deep: #E6DCC7;
      --terra:      #C8531F;
      --terra-deep: #9A3E16;
      --ochre:      #C9923A;
      --sage:       #8AAB5C;
      --moss:       #3D4A2E;
      --stone:      #777770;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--ink);
      font-family: 'Josefin Sans', sans-serif;
      color: var(--paper);
      -webkit-font-smoothing: antialiased;
    }

    /* ═══════════════════════════════════════════════════════════════════
       SECTION 1 · HERO — full-viewport cinematic opening
    ═══════════════════════════════════════════════════════════════════ */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 640px;
      overflow: hidden;
    }

    /* ── Background video carousel ──────────────────────────────────── */
    .video-carousel {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .video-carousel video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      filter: saturate(2.2) grayscale(1) contrast(1.55) brightness(0.60);
      opacity: 0;
      transition: opacity 1.4s ease;
    }

    .video-carousel video.active { opacity: 1; }

    /* ── Film grain ─────────────────────────────────────────────────── */
    #grain {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      mix-blend-mode: overlay;
      opacity: 0.26;
      z-index: 2;
      pointer-events: none;
    }

    /* ── Vignette ───────────────────────────────────────────────────── */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 38%, transparent 20%, rgba(0,0,0,0.72) 100%);
      z-index: 3;
      pointer-events: none;
    }

    /* ── Constellation canvas ───────────────────────────────────────── */
    #constellation {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
    }

    /* ── Form panel — lower third ───────────────────────────────────── */
    .form-panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 5;
      background: linear-gradient(
        to bottom,
        transparent           0%,
        rgba(0,0,0,0.72)     22%,
        rgba(0,0,0,0.93)     48%,
        rgba(0,0,0,0.97)    100%
      );
      padding: 64px 28px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUp 0.9s 0.4s ease both;
    }

    .form-inner {
      width: 100%;
      max-width: 400px;
    }

    /* ── Shared typography ───────────────────────────────────────────── */
    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 5px;
      color: var(--paper);
      opacity: 0.35;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-align: center;
    }

    .tagline {
      font-family: Georgia, 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--terra);
      opacity: 0.85;
      margin-bottom: 28px;
      text-align: center;
    }

    /* ── Form ───────────────────────────────────────────────────────── */
    form {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: 100%;
    }

    .field {
      position: relative;
      border-bottom: 1px solid rgba(239,231,216,0.15);
      transition: border-color 0.25s;
    }

    .field:focus-within { border-bottom-color: var(--terra); }

    input {
      background: transparent;
      border: none;
      color: var(--paper);
      font-family: 'Josefin Sans', sans-serif;
      font-size: 13px;
      letter-spacing: 0.5px;
      padding: 15px 0 11px;
      width: 100%;
      outline: none;
    }

    input::placeholder {
      color: rgba(239,231,216,0.75);
      font-weight: 300;
    }

    /* ── Country code dropdown ─────────────────────────────────────── */
    .phone-row {
      display: flex;
      align-items: stretch;
      gap: 0;
    }

    .phone-row select {
      background: transparent;
      border: none;
      border-right: 1px solid rgba(239,231,216,0.1);
      color: var(--paper);
      font-family: 'Josefin Sans', sans-serif;
      font-size: 13px;
      letter-spacing: 0.5px;
      padding: 15px 6px 11px 0;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      width: 88px;
      flex-shrink: 0;
    }

    .phone-row select option {
      background: #1A1A1A;
      color: #EFE7D8;
    }

    .phone-row input {
      flex: 1;
      padding-left: 10px;
    }

    input:-webkit-autofill,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--paper);
      -webkit-box-shadow: 0 0 0 1000px #1A1A1A inset;
    }

    .submit-wrap { margin-top: 24px; }

    button[type="submit"] {
      background: var(--terra);
      border: none;
      color: var(--paper);
      cursor: pointer;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      padding: 17px 32px;
      text-transform: uppercase;
      width: 100%;
      transition: opacity 0.2s, transform 0.15s;
      -webkit-appearance: none;
    }

    button[type="submit"]:hover  { opacity: 0.88; }
    button[type="submit"]:active { transform: scale(0.985); }

    /* ── Success state ──────────────────────────────────────────────── */
    .success {
      display: none;
      text-align: center;
      padding: 16px 0 32px;
      animation: fadeUp 0.5s ease both;
    }

    .success h2 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 12px;
      color: var(--paper);
    }

    .success p {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 14px;
      color: var(--paper);
      opacity: 0.55;
      line-height: 1.7;
    }

    /* ── Single-screen lock ───────────────────────────────────────── */
    html, body { height: 100%; overflow: hidden; }

    /* ═══════════════════════════════════════════════════════════════════
       SECTION 2 · POSITIONING — what is The Founder's Sprint
    ═══════════════════════════════════════════════════════════════════ */
    .section { padding: 96px 28px; }

    .section-inner {
      max-width: 800px;
      margin: 0 auto;
    }

    /* ═══════════════════════════════════════════════════════════════════
       ANIMATIONS
    ═══════════════════════════════════════════════════════════════════ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ═══════════════════════════════════════════════════════════════════
       ERROR MESSAGE
    ═══════════════════════════════════════════════════════════════════ */
    .form-error {
      display: none;
      font-family: Georgia, serif;
      font-size: 13px;
      color: var(--terra);
      text-align: center;
      margin-top: 12px;
    }

    /* ── Mobile: allow scroll if viewport is short ──────────────── */
    @media (max-height: 620px) {
      .hero { height: auto; min-height: 100vh; }
    }
  </style>
</head>

  <!-- ═══════════════════════════════════════════════════════════════════
       SCRIPTS
  ═══════════════════════════════════════════════════════════════════ -->
  <script>
    /* ══════════════════════════════════════════════════════════════════
       VIDEO CAROUSEL
    ══════════════════════════════════════════════════════════════════ */
    (function () {
      const INTERVAL = 7000;
      const vids = Array.from(document.querySelectorAll('.video-carousel video'));

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      let queue = shuffle(vids.map((_, i) => i));
      let qi    = 0;
      let cur   = queue[qi];

      function activate(idx) {
        vids.forEach((v, i) => {
          if (i === idx) {
            /* Lazy-load: move data-src → src on first activation */
            if (!v.src && v.dataset.src) {
              v.src = v.dataset.src;
              v.load();
            }
            v.currentTime = 0;
            v.play().catch(() => {});
            v.classList.add('active');
          } else {
            v.classList.remove('active');
            v.pause();
          }
        });
        cur = idx;
      }

      activate(cur);

      setInterval(() => {
        qi++;
        if (qi >= queue.length) {
          const fresh = shuffle(vids.map((_, i) => i));
          if (fresh[0] === cur) fresh.push(fresh.shift());
          queue = fresh;
          qi    = 0;
        }
        activate(queue[qi]);
      }, INTERVAL);
    })();

    /* ══════════════════════════════════════════════════════════════════
       FILM GRAIN
    ══════════════════════════════════════════════════════════════════ */
    const grainCanvas = document.getElementById('grain');
    const gc = grainCanvas.getContext('2d');
    let GW, GH;

    function resizeGrain() {
      GW = Math.ceil(window.innerWidth  / 2);
      GH = Math.ceil(window.innerHeight / 2);
      grainCanvas.width  = GW;
      grainCanvas.height = GH;
    }
    resizeGrain();
    window.addEventListener('resize', resizeGrain);

    function updateGrain() {
      const img = gc.createImageData(GW, GH);
      const d   = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = Math.random() * 255;
        d[i] = d[i+1] = d[i+2] = v;
        d[i+3] = 255;
      }
      gc.putImageData(img, 0, 0);
    }
    updateGrain();
    setInterval(updateGrain, 1000 / 12);

    /* ══════════════════════════════════════════════════════════════════
       BRAND TOKENS
    ══════════════════════════════════════════════════════════════════ */
    const COLS  = ['#C8531F', '#C9923A', '#8AAB5C', '#3D4A2E', '#777770'];
    const OPS   = [ 0.85,      0.80,      0.78,      0.82,      0.75    ];
    const NAMES = [
      'MARKETING', 'FINANCIAL\nMODELLING', 'INVESTMENT\nREADINESS',
      'STRATEGY\n& TEAM', 'PRODUCT\nDEV',
    ];
    const INK   = '#1A1A1A';
    const PAPER = '#EFE7D8';

    /* ══════════════════════════════════════════════════════════════════
       CONSTELLATION CANVAS
    ══════════════════════════════════════════════════════════════════ */
    const canvas = document.getElementById('constellation');
    const ctx    = canvas.getContext('2d');
    let W, H, CX, CY;

    function resize() {
      const dpr  = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      W = rect.width;
      H = rect.height;
      canvas.width  = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      CX = W / 2;
      CY = H * 0.33;
    }
    resize();
    window.addEventListener('resize', resize);

    const LOZENGE = [[0,-42],[7,0],[0,42],[-7,0]];

    function drawMark(cx, cy, r, rotation) {
      const s = r / 50;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);
      for (let i = 0; i < 5; i++) {
        ctx.save();
        ctx.rotate((i * 72 * Math.PI) / 180);
        ctx.globalAlpha = OPS[i];
        ctx.fillStyle   = COLS[i];
        ctx.beginPath();
        ctx.moveTo(LOZENGE[0][0] * s, LOZENGE[0][1] * s);
        for (let j = 1; j < LOZENGE.length; j++)
          ctx.lineTo(LOZENGE[j][0] * s, LOZENGE[j][1] * s);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 4.5 * s, 0, Math.PI * 2);
      ctx.fillStyle = PAPER;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, 2 * s, 0, Math.PI * 2);
      ctx.fillStyle = INK;
      ctx.fill();
      ctx.restore();
    }

    const TILT = 0.38;
    const NODES = COLS.map((_, i) => ({
      baseAngle:   (i * 72 - 90) * Math.PI / 180,
      angVel:      0.000165 + i * 0.000012,
      wobbleAmp:   9 + i * 3.5,
      wobbleFreq:  0.00028 + i * 0.000075,
      wobblePhase: i * 1.31,
    }));

    function nodePos(node, t, baseR) {
      const angle = node.baseAngle + node.angVel * t;
      const r     = baseR + Math.sin(node.wobbleFreq * t + node.wobblePhase) * node.wobbleAmp;
      const sx    = Math.cos(angle) * r;
      const sy    = Math.sin(angle) * r * TILT;
      return { x: sx, y: sy };
    }

    function drawPulses(cx, cy, markR, t, ga) {
      const PERIOD = 3200;
      for (let p = 0; p < 3; p++) {
        const phase = ((t / PERIOD) + p / 3) % 1;
        const pr    = markR + phase * markR * 2.8;
        const pa    = (1 - phase) * 0.18 * ga;
        ctx.beginPath();
        ctx.arc(cx, cy, pr, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(200,83,31,${pa})`;
        ctx.lineWidth   = 1;
        ctx.stroke();
      }
    }

    function hexAlpha(hex, a) {
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      return `rgba(${r},${g},${b},${a})`;
    }

    function drawLabel(text, x, y, color, ga) {
      const lines = text.split('\n');
      ctx.font         = `700 9px 'Josefin Sans', sans-serif`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle    = color;
      ctx.globalAlpha  = ga * 0.65;
      const lh  = 13;
      const top = y - ((lines.length - 1) * lh) / 2;
      lines.forEach((line, i) => ctx.fillText(line, x, top + i * lh));
      ctx.globalAlpha = 1;
    }

    let startTime = null;

    function draw(ts) {
      if (!startTime) startTime = ts;
      const t  = ts - startTime;
      const ga = Math.min(1, t / 1800);

      ctx.clearRect(0, 0, W, H);

      const isMobile = W < 500;
      const base     = Math.min(W, H);
      const orbitalR = base * (isMobile ? 0.45 : 0.48);
      const markR    = base * (isMobile ? 0.127 : 0.12);
      const nodeR    = isMobile ? 7.5 : 9.5;
      const showLabels = orbitalR > 130;

      ctx.save();
      ctx.globalAlpha = ga;

      const pos = NODES.map(n => nodePos(n, t, orbitalR));

      // Radial lines
      pos.forEach((p, i) => {
        const nx = CX + p.x, ny = CY + p.y;
        const g  = ctx.createLinearGradient(CX, CY, nx, ny);
        g.addColorStop(0,    hexAlpha(COLS[i], 0.0));
        g.addColorStop(0.25, hexAlpha(COLS[i], 0.08));
        g.addColorStop(1,    hexAlpha(COLS[i], 0.28));
        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.lineTo(nx, ny);
        ctx.strokeStyle = g;
        ctx.lineWidth   = 0.7;
        ctx.stroke();
      });

      // Inter-node lines
      for (let i = 0; i < 5; i++) {
        const j  = (i + 1) % 5;
        const ax = CX + pos[i].x, ay = CY + pos[i].y;
        const bx = CX + pos[j].x, by = CY + pos[j].y;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.strokeStyle = 'rgba(239,231,216,0.05)';
        ctx.lineWidth   = 0.5;
        ctx.stroke();
      }

      // Pulse rings
      ctx.globalAlpha = 1;
      drawPulses(CX, CY, markR, t, ga);
      ctx.globalAlpha = ga;

      // Nodes
      pos.forEach((p, i) => {
        const nx = CX + p.x, ny = CY + p.y;
        const glow = ctx.createRadialGradient(nx, ny, 0, nx, ny, nodeR * 4);
        glow.addColorStop(0, hexAlpha(COLS[i], 0.38));
        glow.addColorStop(1, hexAlpha(COLS[i], 0.00));
        ctx.beginPath();
        ctx.arc(nx, ny, nodeR * 4, 0, Math.PI * 2);
        ctx.fillStyle   = glow;
        ctx.globalAlpha = ga;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(nx, ny, nodeR, 0, Math.PI * 2);
        ctx.fillStyle   = COLS[i];
        ctx.globalAlpha = ga * OPS[i];
        ctx.fill();
        ctx.globalAlpha = ga;

        if (showLabels) {
          const labelDist = nodeR + (isMobile ? 16 : 22);
          const ang = Math.atan2(p.y, p.x);
          const lx  = nx + Math.cos(ang) * labelDist;
          const ly  = ny + Math.sin(ang) * labelDist;
          drawLabel(NAMES[i], lx, ly, COLS[i], ga);
        }
      });

      // V6 mark — slow spin
      ctx.globalAlpha = 1;
      const markSpin  = t * (Math.PI * 2 / 72000);
      drawMark(CX, CY, markR, markSpin);

      ctx.restore();
      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);

    /* ══════════════════════════════════════════════════════════════════
       FORM SUBMISSION — Mailchimp AJAX
    ══════════════════════════════════════════════════════════════════ */
    document.getElementById('waitlist-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn   = this.querySelector('button[type="submit"]');
      const error = document.getElementById('form-error');
      error.style.display = 'none';

      // Combine country code + phone number into hidden PHONE field
      const phoneCode   = document.getElementById('phone-code').value;
      const phoneNumber = document.getElementById('phone-number').value.trim().replace(/^0+/, '');
      document.getElementById('phone-combined').value = phoneNumber ? phoneCode + phoneNumber : '';

      // Basic validation
      const email = this.EMAIL.value.trim();
      const fname = this.FNAME.value.trim();
      const lname = this.LNAME.value.trim();
      if (!email || !fname || !lname) {
        error.textContent   = 'Please enter your first name, last name, and email.';
        error.style.display = 'block';
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'SENDING…';

      try {
        /* ── Mailchimp JSONP submission ──────────────────────────── */
        const formData = new FormData(this);
        const params   = new URLSearchParams(formData).toString();
        const action   = this.action.replace('/post?', '/post-json?') + '&c=callback';

        await new Promise((resolve, reject) => {
          window.callback = function(resp) {
            delete window.callback;
            if (resp.result === 'success') resolve();
            else reject(new Error(resp.msg || 'Subscription failed'));
          };
          const script = document.createElement('script');
          script.src   = action + '&' + params;
          script.onerror = () => reject(new Error('Network error'));
          document.head.appendChild(script);
          setTimeout(() => reject(new Error('Timeout')), 8000);
        });

        this.style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';

      } catch (err) {
        btn.disabled    = false;
        btn.textContent = 'JOIN THE WAITLIST';
        error.textContent   = err.message || 'Something went wrong — please try again.';
        error.style.display = 'block';
      }
    });

  </script>

</body>
</html>
