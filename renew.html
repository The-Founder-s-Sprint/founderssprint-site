<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your booking · The Founder's Sprint</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1A1A; --ink-deep:#0f0d0a; --paper:#EFE7D8; --paper-deep:#E6DCC7;
    --terra:#C8531F; --terra-deep:#9A3E16; --ochre:#C9923A; --sage:#8AAB5C; --moss:#3D4A2E;
    --mute:#5A564F; --border:rgba(26,26,26,0.12);
    --sans:'Josefin Sans',Arial,sans-serif; --display:'Cormorant Garamond',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink-deep);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;}
  .bar{display:flex;align-items:center;gap:11px;padding:20px 24px;}
  .bar .wm{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:2.5px;color:var(--paper);text-transform:uppercase;}
  .wrap{max-width:600px;margin:0 auto;padding:14px 20px 60px;}
  .card{background:var(--paper);border-top:3px solid var(--terra);border-radius:0 0 24px 0;padding:34px 30px;box-shadow:0 30px 70px -30px rgba(0,0,0,0.6);}
  .eyebrow{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--terra);margin:0 0 12px;}
  h1{font-family:var(--display);font-style:italic;font-weight:400;font-size:33px;line-height:1.16;margin:0 0 16px;color:var(--ink);}
  p{font-size:15px;line-height:1.7;color:#2A2826;margin:0 0 16px;}
  .muted{color:var(--mute);font-size:13px;}
  .opt{border:1px solid var(--border);border-top:3px solid var(--terra);border-radius:0 0 18px 0;padding:18px 20px;margin:0 0 14px;background:var(--paper-deep);}
  .opt.refund{border-top-color:var(--terra-deep);}
  .opt .tag{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--terra);margin:0 0 6px;}
  .opt.refund .tag{color:var(--terra-deep);}
  .opt .t{font-family:var(--display);font-size:21px;color:var(--ink);margin:0 0 6px;}
  .opt .d{font-size:13.5px;line-height:1.6;color:#2A2826;margin:0 0 14px;}
  .btn{display:inline-block;width:100%;text-align:center;font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:14px 22px;border:1px solid transparent;cursor:pointer;color:var(--paper);background:var(--terra);}
  .btn.dark{background:var(--ink);}
  .btn:disabled{opacity:.5;cursor:default;}
  .rule{width:70px;height:1px;background:var(--terra);margin:20px 0;}
  .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px solid var(--border);}
  .kv .k{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);}
  .foot{font-family:var(--display);font-style:italic;font-size:15px;color:var(--terra);text-align:center;margin:26px 0 0;}
  .spin{width:30px;height:30px;border:2px solid rgba(200,83,31,.2);border-top-color:var(--terra);border-radius:50%;animation:s .8s linear infinite;margin:30px auto;}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="bar">
    <svg width="26" height="26" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <polygon points="50,8 57,50 50,92 43,50" fill="#C8531F" opacity="0.85"/>
      <polygon points="50,8 57,50 50,92 43,50" fill="#C9923A" opacity="0.8" transform="rotate(72 50 50)"/>
      <polygon points="50,8 57,50 50,92 43,50" fill="#8AAB5C" opacity="0.78" transform="rotate(144 50 50)"/>
      <polygon points="50,8 57,50 50,92 43,50" fill="#3D4A2E" opacity="0.82" transform="rotate(216 50 50)"/>
      <polygon points="50,8 57,50 50,92 43,50" fill="#777770" opacity="0.75" transform="rotate(288 50 50)"/>
      <circle cx="50" cy="50" r="4.5" fill="#EFE7D8"/><circle cx="50" cy="50" r="2" fill="#1A1A1A"/></svg>
    <span class="wm">The&nbsp;Founder's&nbsp;Sprint</span>
  </div>
  <div class="wrap"><div class="card" id="view"><div class="spin"></div></div></div>

<script>
(function(){
  var view = document.getElementById('view');
  var token = new URLSearchParams(location.search).get('token') || '';
  var UGX = function(n){ return 'UGX ' + Number(n||0).toLocaleString('en-UG'); };
  var esc = function(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };

  function shell(inner){ view.innerHTML = inner; }
  function err(msg){ shell('<p class="eyebrow">Booking</p><h1>We couldn’t open this.</h1><p>'+esc(msg)+'</p><p class="muted">If you think this is a mistake, reply to the email we sent, or contact hello@founderssprint.co.</p>'); }

  if(!token){ err('This link is missing its access token.'); return; }

  fetch('/api/grace/'+encodeURIComponent(token))
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(res){
      if(!res.ok){ err((res.j && res.j.error) || 'This link is invalid or has expired.'); return; }
      render(res.j);
    })
    .catch(function(){ err('We couldn’t reach the server. Please try again in a moment.'); });

  function render(d){
    if(d.resolved){
      if(d.choice === 'roll'){ return done('You’re all set.', 'Your booking has already been rolled to the next cohort. Check your email for the details.'); }
      if(d.choice === 'refund'){ return done('Refund in progress.', 'We’ve already logged your refund request — our team will process it to your mobile money shortly.'); }
      return done('This booking is closed.', 'There’s nothing left to decide here. Contact us if you need a hand.');
    }
    var deadline = d.deadline ? new Date(d.deadline).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}) : null;
    var rollCard = d.next ? (
      '<div class="opt" id="opt-roll">'
      + '<div class="tag">Option 1 · Recommended</div>'
      + '<div class="t">Roll to '+esc(d.next.name)+'</div>'
      + '<div class="d">Keep your place and carry your full <strong>'+UGX(d.amountPaid)+'</strong> paid over to the next cohort ('+esc(d.next.dates)+'). Nothing lost — just a later start.</div>'
      + '<button class="btn" data-choice="roll">Roll to the next cohort</button>'
      + '</div>'
    ) : '';
    var refundCard = (
      '<div class="opt refund">'
      + '<div class="tag">'+(d.next?'Option 2':'Your option')+'</div>'
      + '<div class="t">Request a refund</div>'
      + '<div class="d">We’ll refund <strong>'+(d.refundable>0?UGX(d.refundable):'any amount paid above the deposit')+'</strong>. The 10% deposit ('+UGX(d.deposit)+') is non-refundable, as agreed at booking.</div>'
      + '<button class="btn dark" data-choice="refund">Request a refund</button>'
      + '</div>'
    );
    shell(
      '<p class="eyebrow">A quick decision</p>'
      + '<h1>Hi '+esc(d.firstName||'there')+' — your balance is outstanding.</h1>'
      + '<p>We didn’t receive the balance for <strong>'+esc(d.cohortName||'your cohort')+'</strong> by the deadline, so we’ve held your place rather than cancel it. Choose how you’d like to proceed'+(deadline?(' by <strong>'+esc(deadline)+'</strong>'):'')+':</p>'
      + '<div class="rule"></div>'
      + rollCard + refundCard
      + (d.next ? '<p class="muted">If you do nothing by '+esc(deadline)+', we’ll roll everything to '+esc(d.next.name)+' automatically — you won’t lose what you’ve paid.</p>' : '<p class="muted">No upcoming cohort is open yet, so a refund is the option here — or reply to us to discuss.</p>')
      + '<div class="foot">Build with direction.</div>'
    );
    Array.prototype.forEach.call(view.querySelectorAll('button[data-choice]'), function(b){
      b.addEventListener('click', function(){ choose(b.getAttribute('data-choice'), d); });
    });
  }

  function choose(choice, d){
    if(choice === 'refund'){
      var amt = d.refundable>0 ? UGX(d.refundable) : 'no refundable balance (the deposit is non-refundable)';
      if(!confirm('Request a refund of '+amt+'? Your place will be released and the 10% deposit is kept.')) return;
    }
    Array.prototype.forEach.call(view.querySelectorAll('button'), function(b){ b.disabled = true; });
    shell('<div class="spin"></div>');
    fetch('/api/grace/'+encodeURIComponent(token), {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ choice: choice })
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if(!res.ok){ err((res.j && res.j.error) || 'We couldn’t save your choice. Please try again.'); return; }
        if(res.j.choice === 'roll'){ done('You’re rolled into '+esc(res.j.next && res.j.next.name || 'the next cohort')+'.', 'Your full paid amount carries over. We’ve emailed you the new dates — your balance is now due before the new start.'); }
        else { var got = res.j.refund; done('Refund requested.', got>0 ? ('We’ll process '+UGX(got)+' to your mobile money within a few business days. The 10% deposit is retained per policy.') : ('Your place is released. As agreed, the 10% deposit is non-refundable, so there’s no refundable balance — but you’re welcome back any time.')); }
      })
      .catch(function(){ err('We couldn’t reach the server. Please try again in a moment.'); });
  }

  function done(title, msg){
    shell('<p class="eyebrow">Done</p><h1>'+esc(title)+'</h1><p>'+esc(msg)+'</p><p class="muted">A confirmation is on its way to your inbox. Questions? hello@founderssprint.co</p><div class="foot">Build with direction.</div>');
  }
})();
</script>
</body>
</html>
