<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resource Directory — The Founder's Sprint</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Curated service providers for East African founders — legal, accounting, design, digital, and more. Vetted by The Founder's Sprint.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Josefin+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== TOKENS — matching beta site ===== */
:root {
  --radius-card: 0 0 24px 0;
  --paper:   #efe7d8;
  --paper-2: #f6f0e3;
  --ink:     #1a1a1a;
  --ink-2:   #0f0d0a;
  --terra:   #c8531f;
  --terra-d: #9a3e15;
  --ochre:   #c9923a;
  --sage:    #8aab5c;
  --moss:    #3d4a2e;
  --stone:   #777770;
  --line-d:  rgba(239,231,216,0.10);
  --line-l:  rgba(26,26,26,0.10);

  --display: "Cormorant Garamond", serif;
  --sans:    "Josefin Sans", sans-serif;
  --body:    "Inter", system-ui, sans-serif;
  --mono:    "JetBrains Mono", monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--body);
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  line-height: 1.55; font-size: 17px;
}
a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }

/* ===== GRAIN ===== */
.noise {
  position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.07;
  background-image: url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27300%27%20height%3D%27300%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.85%27%20numOctaves%3D%273%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200.95%200%200%200%200%200.92%200%200%200%200%200.85%200%200%200%201%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27300%27%20height%3D%27300%27%20filter%3D%27url%28%23n%29%27%2F%3E%3C%2Fsvg%3E");
}

/* ===== LAYOUT ===== */
.shell { width: 100%; max-width: 1440px; margin: 0 auto; padding: 0 56px; }
section, footer, nav { position: relative; z-index: 2; }

/* ===== V6 LOGO MARK (inline for eyebrows) ===== */
.v6-mark { display: inline-block; width: 14px; height: 14px; vertical-align: middle; flex-shrink: 0; }

/* ===== TYPE ===== */
.eyebrow {
  font-family: var(--sans); font-size: 10px; font-weight: 700;
  letter-spacing: 0.32em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 8px;
}
.h-section {
  font-family: var(--display); font-style: italic; font-weight: 400;
  font-size: clamp(34px, 4.4vw, 56px);
  line-height: 1.04; letter-spacing: -0.008em; text-wrap: balance;
}
.h-sub {
  font-family: var(--body); font-size: 17px; line-height: 1.55;
  max-width: 56ch; text-wrap: pretty;
}

/* ===== NAV ===== */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  padding: 22px 56px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(15,13,10,0.88);
  border-bottom: 1px solid var(--line-d);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.nav .brand { display: flex; align-items: center; gap: 12px; color: var(--paper); }
.nav .brand svg { width: 26px; height: 26px; }
.nav .brand .wm {
  font-family: var(--sans); font-weight: 700; font-size: 12px;
  letter-spacing: 0.30em; text-transform: uppercase;
}
.nav .links { display: flex; justify-content: center; gap: 36px; }
.nav .links a {
  font-family: var(--mono); font-size: 10.5px;
  letter-spacing: 0.20em; text-transform: uppercase;
  color: rgba(239,231,216,0.55);
  text-decoration: none; transition: color 200ms;
}
.nav .links a:hover { color: var(--paper); }
.nav .links a.active { color: var(--terra); }
.nav .cta { justify-self: end; display: flex; gap: 14px; align-items: center; }
.nav .cta .ghost {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(239,231,216,0.55); text-decoration: none;
  transition: color 200ms;
}
.nav .cta .ghost:hover { color: var(--paper); }
.nav .cta .nav-pill {
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  letter-spacing: 0.20em; text-transform: uppercase;
  padding: 10px 22px; background: var(--terra);
  color: var(--paper); border: none; cursor: pointer;
  text-decoration: none; transition: filter 200ms, transform 200ms;
}
.nav .cta .nav-pill:hover { filter: brightness(1.1); transform: translateY(-1px); }

/* ===== HERO — now rendered by the shared site-chrome module (.fsx-hero); width via this page's own .shell (1440) ===== */
.btn-apply {
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  letter-spacing: 4px; text-transform: uppercase;
  padding: 17px 32px; display: inline-block;
  background: var(--terra); color: var(--paper);
  transition: opacity 0.2s, transform 0.15s;
}
.btn-apply:hover { opacity: 0.88; }

/* ===== CATEGORY FILTER ===== */
.filter-section { padding: 48px 0 0; }
.filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.filter-btn {
  font-family: var(--sans); font-size: 10px; font-weight: 600;
  letter-spacing: 0.15em; text-transform: uppercase;
  padding: 9px 16px; cursor: pointer;
  background: transparent; border: 1px solid var(--line-l);
  color: var(--stone); transition: all 200ms;
}
.filter-btn:hover { border-color: var(--terra); color: var(--terra); }
.filter-btn.active { background: var(--terra); color: var(--paper); border-color: var(--terra); }

/* ===== DIRECTORY GRID ===== */
.directory-section { padding: 48px 0 100px; }
.directory-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px;
}

/* --- Provider card: Cloudflare-inspired transitions --- */
.provider-card {
  position: relative; background: var(--paper-2);
  display: flex; flex-direction: column;
  transition: transform .6s cubic-bezier(.25,.46,.45,.94),
              box-shadow .6s cubic-bezier(.25,.46,.45,.94);
  overflow: hidden;
 border-radius: var(--radius-card); overflow: hidden;}
.provider-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 40px rgba(26,26,26,0.08), 0 2px 8px rgba(26,26,26,0.04);
}

/* Color bar: expands on hover */
.provider-card .card-bar {
  height: 3px; transition: height .5s cubic-bezier(.25,.46,.45,.94);
}
.provider-card:hover .card-bar { height: 5px; }

/* Category colors */
.cat-legal    { background: var(--terra); }
.cat-accounting { background: var(--ochre); }
.cat-design   { background: var(--terra); }
.cat-unbs     { background: var(--moss); }
.cat-banking  { background: var(--ochre); }
.cat-insurance { background: var(--stone); }
.cat-ip       { background: var(--terra-d); }
.cat-digital  { background: var(--ink); }

.provider-card .card-body { padding: 28px 28px 24px; flex: 1; display: flex; flex-direction: column; }

/* Head: initials + meta */
.provider-card .card-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
.provider-card .card-initials {
  width: 46px; height: 46px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--sans); font-weight: 600; font-size: 15px; letter-spacing: 0.02em;
  flex-shrink: 0; color: var(--paper);
  transition: transform .5s cubic-bezier(.25,.46,.45,.94);
}
.provider-card:hover .card-initials { transform: scale(1.06); }

.provider-card .card-meta { flex: 1; min-width: 0; }
.provider-card .featured-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--sans); font-size: 8px; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase;
  background: rgba(201,146,58,0.14); color: var(--ochre);
  padding: 3px 9px; margin-bottom: 5px;
}
.provider-card .featured-badge svg { width: 10px; height: 10px; }
.provider-card .cat-label {
  font-family: var(--sans); font-size: 9px; font-weight: 700;
  letter-spacing: 0.20em; text-transform: uppercase;
  margin-bottom: 3px; transition: color .4s ease;
}
.provider-card .company-name {
  font-family: var(--display); font-size: 24px; font-weight: 400;
  color: var(--ink); line-height: 1.15;
}
.provider-card .description {
  font-size: 14px; color: rgba(26,26,26,0.58); line-height: 1.55;
  margin-bottom: 18px; flex: 1;
}

/* Contact actions: slide up on hover */
.provider-card .card-divider {
  border: none; border-top: 1px solid rgba(26,26,26,0.07);
  margin: 0 0 14px;
}
.provider-card .card-actions {
  display: flex; flex-wrap: wrap; gap: 8px;
  opacity: 0.6; transform: translateY(4px);
  transition: opacity .5s cubic-bezier(.25,.46,.45,.94),
              transform .5s cubic-bezier(.25,.46,.45,.94);
}
.provider-card:hover .card-actions {
  opacity: 1; transform: translateY(0);
}
.card-action-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--body); font-size: 12px; font-weight: 500;
  padding: 7px 13px; border-radius: 6px;
  border: 1px solid rgba(26,26,26,0.10);
  background: transparent; color: var(--ink);
  transition: all .3s cubic-bezier(.25,.46,.45,.94);
  text-decoration: none; cursor: pointer;
}
.card-action-btn:hover {
  border-color: rgba(26,26,26,0.22);
  background: rgba(26,26,26,0.03);
}
.card-action-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

/* WhatsApp button */
.card-action-btn.wa {
  border-color: rgba(37,211,102,0.3);
  color: #128C7E;
}
.card-action-btn.wa:hover {
  background: rgba(37,211,102,0.08);
  border-color: rgba(37,211,102,0.5);
}

/* Featured card accent */
.provider-card.featured {
  box-shadow: 0 0 0 1px rgba(201,146,58,0.2);
}
.provider-card.featured:hover {
  box-shadow: 0 12px 40px rgba(26,26,26,0.08), 0 0 0 1px rgba(201,146,58,0.3);
}

/* Category label colors */
.label-legal, .label-design { color: var(--terra); }
.label-accounting, .label-banking { color: var(--ochre); }
.label-unbs { color: var(--moss); }
.label-insurance { color: var(--stone); }
.label-ip { color: var(--terra-d); }
.label-digital { color: var(--ink); }

/* ===== PROGRAMME SPONSORS BANNER ===== */
.sponsor-strip {
  padding: 28px 0;
  border-bottom: 1px solid var(--line-l);
  margin-bottom: 32px;
}
.sponsor-strip-label {
  font-family: var(--sans); font-size: 9px; font-weight: 600;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--stone); margin-bottom: 16px; text-align: center;
}
.sponsor-strip-row {
  display: flex; justify-content: center; align-items: center;
  flex-wrap: wrap; gap: 40px;
}
.sponsor-item {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  text-decoration: none; opacity: 0.7; transition: opacity 200ms;
}
.sponsor-item:hover { opacity: 1; }
.sponsor-item img {
  height: 32px; width: auto; filter: grayscale(100%); transition: filter 200ms;
}
.sponsor-item:hover img { filter: grayscale(0%); }
.sponsor-item .sponsor-tagline {
  font-family: var(--sans); font-size: 9px; font-weight: 500;
  letter-spacing: 0.08em; color: var(--stone); text-transform: uppercase;
}

/* ===== SECTION DIVIDER ===== */
.dir-section-label {
  font-family: var(--sans); font-size: 10px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--stone); margin: 40px 0 20px; padding-bottom: 10px;
  border-bottom: 1px solid var(--line-l);
  grid-column: 1 / -1;
}
.basic-table-wrap { grid-column: 1 / -1; }

/* ===== BASIC TABLE ===== */
.basic-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.basic-table th {
  font-family: var(--sans); font-size: 9px; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--stone); text-align: left; padding: 10px 12px;
  border-bottom: 2px solid var(--line-l); cursor: pointer; user-select: none;
}
.basic-table th:hover { color: var(--ink); }
.basic-table td {
  font-family: var(--body); font-size: 13px; color: var(--ink);
  padding: 14px 12px; border-bottom: 1px solid rgba(26,26,26,0.06);
  vertical-align: top;
}
.basic-table tr:hover td { background: rgba(26,26,26,0.015); }
.basic-table .td-company { font-weight: 500; white-space: nowrap; }
.basic-table .td-cat {
  font-family: var(--sans); font-size: 10px; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
}
.basic-table .td-desc { color: var(--stone); font-size: 12.5px; max-width: 400px; }
.basic-table .td-email a {
  color: var(--terra); text-decoration: none;
  font-family: var(--sans); font-size: 10px; letter-spacing: 0.04em;
  display: inline-flex; align-items: center; gap: 4px;
}
.basic-table .td-email a:hover { color: var(--terra-d); }
.basic-table .td-email svg { width: 13px; height: 13px; }
@media (max-width: 700px) {
  .basic-table .td-desc { display: none; }
  .basic-table .td-cat { display: none; }
}

/* ===== BASIC CARDS — listings split into a column grid ===== */
.basic-grid {
  grid-column: 1 / -1;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px;
  margin-top: 8px;
}
.basic-card {
  position: relative; background: var(--paper-2); overflow: hidden;
  border-radius: var(--radius-card); border: 1px solid var(--line-l);
  display: flex; flex-direction: column;
  transition: transform .5s cubic-bezier(.25,.46,.45,.94), box-shadow .5s cubic-bezier(.25,.46,.45,.94);
}
.basic-card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px -18px rgba(26,26,26,0.35); }
.basic-card .bc-bar { height: 3px; width: 100%; }
.basic-card .bc-body { padding: 20px 22px 18px; flex: 1; display: flex; flex-direction: column; }
.basic-card .bc-cat {
  font-family: var(--sans); font-size: 10px; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px;
}
.basic-card .bc-name { font-family: var(--display); font-size: 21px; font-weight: 400; color: var(--ink); line-height: 1.18; }
.basic-card .bc-desc {
  color: var(--stone); font-size: 12.5px; line-height: 1.5; margin: 8px 0 0;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.basic-card .bc-foot { margin-top: auto; padding-top: 14px; }
.basic-card .bc-email {
  color: var(--terra); text-decoration: none;
  font-family: var(--sans); font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em;
  display: inline-flex; align-items: center; gap: 5px;
}
.basic-card .bc-email:hover { color: var(--terra-d); }
.basic-card .bc-email svg { width: 13px; height: 13px; }
.basic-card .bc-none { color: var(--stone); font-size: 11px; font-style: italic; }
.basic-sort {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 8px;
  margin: -8px 0 4px; font-family: var(--sans); font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone);
}
.basic-sort button {
  font: inherit; letter-spacing: inherit; text-transform: inherit;
  background: none; border: none; cursor: pointer; padding: 4px 2px;
  color: var(--stone); border-bottom: 2px solid transparent;
}
.basic-sort button:hover { color: var(--ink); }
.basic-sort button.on { color: var(--terra); border-bottom-color: var(--terra); }

/* Empty state */
.empty-state { grid-column: 1 / -1; text-align: center; padding: 80px 20px; }
.empty-state h3 {
  font-family: var(--display); font-size: 28px; font-weight: 300;
  color: var(--ink); margin-bottom: 12px;
}
.empty-state p { font-size: 15px; color: var(--stone); max-width: 400px; margin: 0 auto 24px; }
.empty-state .btn-apply { font-size: 10px; padding: 14px 24px; }

/* Loading skeleton */
.skeleton-card { background: var(--paper-2); overflow: hidden; }
.skeleton-bar { height: 3px; background: rgba(26,26,26,0.06); }
.skeleton-body { padding: 28px 28px 24px; }
.skeleton-head { display: flex; gap: 14px; margin-bottom: 14px; align-items: flex-start; }
.skeleton-avatar { width: 46px; height: 46px; border-radius: 8px; background: rgba(26,26,26,0.06); flex-shrink: 0; animation: pulse 1.5s ease-in-out infinite; }
.skeleton-line { height: 12px; background: rgba(26,26,26,0.06); margin-bottom: 10px; border-radius: 4px; animation: pulse 1.5s ease-in-out infinite; }
.skeleton-line.short { width: 35%; } .skeleton-line.medium { width: 70%; }
.skeleton-line.long { width: 100%; } .skeleton-line.title { height: 18px; width: 55%; margin-bottom: 0; }
.skeleton-line-divider { height: 1px; background: rgba(26,26,26,0.05); margin: 14px 0; }
.skeleton-actions { display: flex; gap: 8px; }
.skeleton-btn { width: 80px; height: 32px; border-radius: 6px; background: rgba(26,26,26,0.04); animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* ===== FOOTER — universal (matches beta site) ===== */
footer {
  background: #08070a; color: rgba(239,231,216,0.55);
  padding: 56px 56px 36px; border-top: 1px solid var(--line-d);
  position: relative; overflow: hidden;
}
.footer-constellation-bg {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 500px 300px at 10% 50%, rgba(200,83,31,0.18) 0%, transparent 65%),
    radial-gradient(ellipse 400px 250px at 50% 20%, rgba(201,146,58,0.12) 0%, transparent 65%),
    radial-gradient(ellipse 450px 280px at 90% 60%, rgba(138,171,92,0.10) 0%, transparent 65%),
    radial-gradient(ellipse 350px 220px at 30% 85%, rgba(61,74,46,0.14) 0%, transparent 65%),
    radial-gradient(ellipse 300px 200px at 70% 40%, rgba(200,83,31,0.06) 0%, transparent 70%);
}
.footer-constellation-bg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
footer .row {
  max-width: 1440px; margin: 0 auto;
  display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
  gap: 36px; position: relative; z-index: 1;
}
footer .col h6 {
  font-family: var(--sans); font-size: 10px; font-weight: 700;
  letter-spacing: 0.28em; text-transform: uppercase;
  color: rgba(239,231,216,0.4); margin-bottom: 14px;
}
footer .col ul {
  list-style: none; display: flex; flex-direction: column; gap: 10px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
  padding: 0; margin: 0;
}
footer .col a { color: rgba(239,231,216,0.65); text-decoration: none; transition: color 200ms; }
footer .col a:hover { color: #efe7d8; }
footer a { text-decoration: none; }
footer .brand-col .blurb {
  font-family: var(--body); font-size: 12.5px; color: rgba(239,231,216,0.55);
  max-width: 40ch; line-height: 1.55;
}
footer .footer-social { display: flex; gap: 14px; margin-top: 16px; }
footer .footer-social a { color: rgba(239,231,216,0.4); transition: color 200ms; }
footer .footer-social a:hover { color: var(--paper); }
footer .footer-social svg { display: block; }
footer .bottom {
  max-width: 1440px; margin: 48px auto 0; padding-top: 24px;
  border-top: 1px solid var(--line-d);
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(239,231,216,0.35);
  position: relative; z-index: 1;
}

/* ===== MOBILE ===== */
@media (max-width: 1100px) {
  .shell { padding: 0 32px; }
  .nav { padding: 18px 32px; }
  footer { padding: 48px 32px 32px; }
  footer .row { gap: 24px; }
}
@media (max-width: 860px) {
  footer .row { grid-template-columns: 2fr 1fr 1fr; }
  footer .col:nth-child(4),
  footer .col:nth-child(5) { grid-row: 2; }
}
@media (max-width: 700px) {
  .nav { padding: 16px 20px; }
  .nav .brand .wm { font-size: 10px; letter-spacing: 0.22em; }
  .shell { padding: 0 24px; }
  .directory-grid { grid-template-columns: 1fr; }
  .filter-bar { gap: 6px; }
  .filter-btn { padding: 8px 12px; font-size: 9px; }
  footer { padding: 40px 24px 28px; }
  footer .row { grid-template-columns: 1fr 1fr; }
  footer .brand-col { grid-column: 1 / -1; }
  footer .bottom { flex-direction: column; gap: 10px; }
}
@media (max-width: 480px) {
  footer .row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="noise" aria-hidden="true"></div>

<!-- NAV -->
<div id="fs-nav"></div>

<!-- HERO with constellation -->

<script>

/* V6 diamond mark SVG for featured badge */
var V6_MINI = '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,8 57,50 50,92 43,50" fill="currentColor" opacity="0.85"/><polygon points="50,8 57,50 50,92 43,50" fill="currentColor" opacity="0.65" transform="rotate(72 50 50)"/><polygon points="50,8 57,50 50,92 43,50" fill="currentColor" opacity="0.55" transform="rotate(144 50 50)"/><polygon points="50,8 57,50 50,92 43,50" fill="currentColor" opacity="0.65" transform="rotate(216 50 50)"/><polygon points="50,8 57,50 50,92 43,50" fill="currentColor" opacity="0.55" transform="rotate(288 50 50)"/><circle cx="50" cy="50" r="4.5" fill="currentColor" opacity="0.8"/></svg>';

/* WhatsApp SVG icon */
var WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>';

/* Email SVG icon */
var MAIL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>';

/* Phone SVG icon */
var PHONE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>';

/* Website SVG icon */
var LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function getInitials(name) {
  if (!name) return '?';
  var parts = name.trim().split(/\s+/);
  if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
  return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
}

function formatWhatsApp(phone) {
  if (!phone) return '';
  return phone.replace(/[\s\-\(\)]/g, '').replace(/^\+/, '');
}

function renderProviderCard(p) {
  var cat = p.category || 'digital';
  var initials = getInitials(p.company_name);
  var html = '<div class="provider-card' + (p.tier === 'verified' ? ' featured' : '') + '">';
  html += '<div class="card-bar cat-' + esc(cat) + '"></div>';
  html += '<div class="card-body">';
  html += '<div class="card-head">';
  if (p.logo_url) {
    html += '<img src="' + esc(p.logo_url) + '" alt="" style="width:40px;height:40px;border-radius:4px;object-fit:contain">';
  } else {
    html += '<div class="card-initials cat-' + esc(cat) + '">' + initials + '</div>';
  }
  html += '<div class="card-meta">';
  html += '<span class="featured-badge">' + V6_MINI + ' Verified Partner</span>';
  html += '<div class="cat-label label-' + esc(cat) + '">' + esc(CATEGORY_LABELS[cat] || cat) + '</div>';
  html += '<div class="company-name">' + esc(p.company_name) + '</div>';
  html += '</div></div>';
  if (p.description) html += '<div class="description">' + esc(p.description) + '</div>';
  html += '<hr class="card-divider"><div class="card-actions">';
  if (p.phone) html += '<a class="card-action-btn wa" href="https://wa.me/' + formatWhatsApp(p.phone) + '" target="_blank" rel="noopener">' + WA_ICON + ' WhatsApp</a>';
  if (p.email) html += '<a class="card-action-btn" href="mailto:' + esc(p.email) + '">' + MAIL_ICON + ' Email</a>';
  if (p.phone) html += '<a class="card-action-btn" href="tel:' + esc(p.phone.replace(/\s/g,'')) + '">' + PHONE_ICON + ' Call</a>';
  if (p.website) { var url = p.website; if (!url.match(/^https?:\/\//)) url = 'https://' + url; html += '<a class="card-action-btn" href="' + esc(url) + '" target="_blank" rel="noopener">' + LINK_ICON + ' Website</a>'; }
  html += '</div></div></div>';
  return html;
}

function renderBasicCard(p) {
  var cat = p.category || 'other';
  var html = '<div class="basic-card">';
  html += '<span class="bc-bar cat-' + esc(cat) + '"></span>';
  html += '<div class="bc-body">';
  html += '<div class="bc-cat label-' + esc(cat) + '">' + esc(CATEGORY_LABELS[cat] || cat) + '</div>';
  html += '<div class="bc-name">' + esc(p.company_name) + '</div>';
  if (p.description) html += '<p class="bc-desc">' + esc(p.description) + '</p>';
  html += '<div class="bc-foot">';
  html += p.email
    ? '<a class="bc-email" href="mailto:' + esc(p.email) + '">' + MAIL_ICON + ' Email</a>'
    : '<span class="bc-none">No contact listed</span>';
  html += '</div></div></div>';
  return html;
}

// Inline sponsor strip removed — handled by sponsors.js scrolling strip above filter bar
function renderSponsorStrip() { return ''; }

var basicSortField = 'company_name';
var basicSortAsc = true;

function renderProviders(providers) {
  if (!providers.length) {
    grid.innerHTML = '<div class="empty-state">' +
      '<h3>No providers listed yet</h3>' +
      '<p>' + (activeFilter === 'all'
        ? 'Be the first to join our curated directory of service providers for East African founders.'
        : 'No providers in this category yet. Check back soon or apply to be the first.') +
      '</p>' +
      '<a class="btn-apply" href="apply-directory.html">Apply to be listed &rarr;</a>' +
      '</div>';
    return;
  }

  // Split by tier — corporate sponsors handled by sponsors.js strip
  // Corporate/programme/strategic sponsors show ONLY in the scrolling strip — not as cards
  var verified = providers.filter(function(p) { return p.tier === 'verified'; });
  var basic = providers.filter(function(p) { return p.tier === 'basic' || (!p.tier); });

  var html = '';

  // ── VERIFIED CARDS — flat grid, no category grouping ──
  if (verified.length) {
    html += '<div class="dir-section-label">Verified Partners</div>';
    html += '<div class="directory-grid">';
    verified.sort(function(a, b) { return (a.company_name || '').localeCompare(b.company_name || ''); });
    verified.forEach(function(p) { html += renderProviderCard(p); });
    html += '</div>';
  }

  // ── BASIC TABLE — full width, sortable ──
  if (basic.length) {
    html += '<div class="dir-section-label">Directory Listings</div>';

    // Sort basic providers
    basic.sort(function(a, b) {
      var valA = (a[basicSortField] || '').toLowerCase();
      var valB = (b[basicSortField] || '').toLowerCase();
      return basicSortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
    });

    var arrow = function(field) { return basicSortField === field ? (basicSortAsc ? ' ↑' : ' ↓') : ''; };
    var on = function(field) { return basicSortField === field ? ' on' : ''; };

    html += '<div class="basic-sort"><span>Sort</span>';
    html += '<button class="' + on('company_name').trim() + '" onclick="sortBasic(\'company_name\')">Company' + arrow('company_name') + '</button>';
    html += '<button class="' + on('category').trim() + '" onclick="sortBasic(\'category\')">Category' + arrow('category') + '</button>';
    html += '</div>';

    html += '<div class="basic-grid">';
    basic.forEach(function(p) { html += renderBasicCard(p); });
    html += '</div>';
  }

  if (!verified.length && !basic.length) {
    html += '<div class="empty-state"><p>No providers in this category.</p><a class="btn-apply" href="apply-directory.html">Apply to be listed &rarr;</a></div>';
  }

  grid.innerHTML = html;
}

function sortBasic(field) {
  if (basicSortField === field) { basicSortAsc = !basicSortAsc; }
  else { basicSortField = field; basicSortAsc = true; }
  var filtered = activeFilter === 'all' ? allProviders : allProviders.filter(function(p) { return p.category === activeFilter; });
  renderProviders(filtered);
}

function applyFilter(cat) {
  activeFilter = cat;
  var filtered = cat === 'all' ? allProviders : allProviders.filter(function(p) { return p.category === cat; });
  renderProviders(filtered);
  var btns = filterBar.querySelectorAll('.filter-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', btns[i].getAttribute('data-cat') === cat);
  }
}

filterBar.addEventListener('click', function(e) {
  var btn = e.target.closest('.filter-btn');
  if (!btn) return;
  applyFilter(btn.getAttribute('data-cat'));
});

async function loadDirectory() {
  try {
    // Raw fetch — bypasses slow Supabase client init in Safari
    var url = SUPABASE_URL + '/rest/v1/directory_providers?select=company_name,category,description,contact_name,email,phone,website,logo_url,tier,featured,banner_tagline,status&status=eq.active&order=tier,company_name';
    var res = await fetch(url, {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Accept': 'application/json' }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    allProviders = await res.json();
    renderProviders(allProviders);
  } catch (err) {
    console.error('Failed to load directory:', err);
    grid.innerHTML = '<div class="empty-state">' +
      '<h3>Directory coming soon</h3>' +
      '<p>We\'re building our curated directory of service providers for East African founders. Apply now to be listed when we launch.</p>' +
      '<a class="btn-apply" href="apply-directory.html">Apply to be listed &rarr;</a>' +
      '</div>';
  }
}

loadDirectory();
</script>
