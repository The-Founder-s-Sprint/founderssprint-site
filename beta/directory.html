<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resource Directory — The Founder's Sprint</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Curated service providers for East African founders — legal, accounting, design, digital, and more. Vetted by The Founder's Sprint.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Josefin+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== TOKENS — matching beta site ===== */
:root {
  --radius-card: 0 0 24px 0;
  --paper:   #efe7d8;
  --paper-2: #f6f0e3;
  --ink:     #1a1a1a;
  --ink-2:   #0f0d0a;
  --terra:   #c8531f;
  --terra-d: #9a3e15;
  --ochre:   #c9923a;
  --sage:    #8aab5c;
  --moss:    #3d4a2e;
  --stone:   #777770;
  --line-d:  rgba(239,231,216,0.10);
  --line-l:  rgba(26,26,26,0.10);

  --display: "Cormorant Garamond", serif;
  --sans:    "Josefin Sans", sans-serif;
  --body:    "Inter", system-ui, sans-serif;
  --mono:    "JetBrains Mono", monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--body);
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  line-height: 1.55; font-size: 17px;
}
a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }

/* ===== GRAIN ===== */
.noise {
  position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.07;
  background-image: url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27300%27%20height%3D%27300%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.85%27%20numOctaves%3D%273%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200.95%200%200%200%200%200.92%200%200%200%200%200.85%200%200%200%201%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27300%27%20height%3D%27300%27%20filter%3D%27url%28%23n%29%27%2F%3E%3C%2Fsvg%3E");
}

/* ===== LAYOUT ===== */
.shell { width: 100%; max-width: 1440px; margin: 0 auto; padding: 0 56px; }
section, footer, nav { position: relative; z-index: 2; }

/* ===== V6 LOGO MARK (inline for eyebrows) ===== */
.v6-mark { display: inline-block; width: 14px; height: 14px; vertical-align: middle; flex-shrink: 0; }

/* ===== TYPE ===== */
.eyebrow {
  font-family: var(--sans); font-size: 10px; font-weight: 700;
  letter-spacing: 0.32em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 8px;
}
.h-section {
  font-family: var(--display); font-style: italic; font-weight: 400;
  font-size: clamp(34px, 4.4vw, 56px);
  line-height: 1.04; letter-spacing: -0.008em; text-wrap: balance;
}
.h-sub {
  font-family: var(--body); font-size: 17px; line-height: 1.55;
  max-width: 56ch; text-wrap: pretty;
}

/* ===== NAV ===== */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  padding: 22px 56px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(15,13,10,0.88);
  border-bottom: 1px solid var(--line-d);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.nav .brand { display: flex; align-items: center; gap: 12px; color: var(--paper); }
.nav .brand svg { width: 26px; height: 26px; }
.nav .brand .wm {
  font-family: var(--sans); font-weight: 700; font-size: 12px;
  letter-spacing: 0.30em; text-transform: uppercase;
}
.nav .links { display: flex; justify-content: center; gap: 36px; }
.nav .links a {
  font-family: var(--mono); font-size: 10.5px;
  letter-spacing: 0.20em; text-transform: uppercase;
  color: rgba(239,231,216,0.55);
  text-decoration: none; transition: color 200ms;
}
.nav .links a:hover { color: var(--paper); }
.nav .links a.active { color: var(--terra); }
.nav .cta { justify-self: end; display: flex; gap: 14px; align-items: center; }
.nav .cta .ghost {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(239,231,216,0.55); text-decoration: none;
  transition: color 200ms;
}
.nav .cta .ghost:hover { color: var(--paper); }
.nav .cta .nav-pill {
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  letter-spacing: 0.20em; text-transform: uppercase;
  padding: 10px 22px; background: var(--terra);
  color: var(--paper); border: none; cursor: pointer;
  text-decoration: none; transition: filter 200ms, transform 200ms;
}
.nav .cta .nav-pill:hover { filter: brightness(1.1); transform: translateY(-1px); }

/* ===== HERO — now rendered by the shared site-chrome module (.fsx-hero); width via this page's own .shell (1440) ===== */
.btn-apply {
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  letter-spacing: 4px; text-transform: uppercase;
  padding: 17px 32px; display: inline-block;
  background: var(--terra); color: var(--paper);
  transition: opacity 0.2s, transform 0.15s;
}
.btn-apply:hover { opacity: 0.88; }

/* ===== CATEGORY FILTER ===== */
.filter-section { padding: 48px 0 0; }
.filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.filter-btn {
  font-family: var(--sans); font-size: 10px; font-weight: 600;
  letter-spacing: 0.15em; text-transform: uppercase;
  padding: 9px 16px; cursor: pointer;
  background: transparent; border: 1px solid var(--line-l);
  color: var(--stone); transition: all 200ms;
}
.filter-btn:hover { border-color: var(--terra); color: var(--terra); }
.filter-btn.active { background: var(--terra); color: var(--paper); border-color: var(--terra); }

/* ===== DIRECTORY — cascading board (matches the mentors board) ===== */
.directory-section { padding: 40px 0 100px; }
.board{position:relative;width:100%;}
.empty,.empty-state{text-align:center;padding:70px 20px;color:var(--stone);}
.empty-state h3{font-family:var(--display);font-size:28px;font-weight:300;color:var(--ink);margin-bottom:12px;}
.empty-state p{font-size:15px;color:var(--stone);max-width:400px;margin:0 auto 24px;}
.card{position:absolute;top:0;left:0;border-radius:var(--radius-card);overflow:hidden;cursor:pointer;background:var(--paper-2);
  box-shadow:0 1px 2px rgba(26,26,26,.06);
  transition:transform .55s cubic-bezier(.4,.9,.3,1),width .55s cubic-bezier(.4,.9,.3,1),height .55s cubic-bezier(.4,.9,.3,1),box-shadow .4s ease;
  will-change:transform,width,height;}
.card:hover{box-shadow:0 16px 40px rgba(26,26,26,.12);}
.card.expanded{box-shadow:0 26px 60px rgba(26,26,26,.20);cursor:default;z-index:3;}
.photo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;}
/* ONE image treatment. Free listings → monogram. Paid listings → the image
   (logo file or profile photo) scales to FILL the card frame, edge-to-edge,
   with the label overlaid — exactly like a mentor photo card. No plates, no
   panels, nothing floating. */
.photo .fill-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
/* Expanded card: the tile becomes the image's own panel — contained, so a wordmark
   is never cropped when the founder is actually looking at it. */
.full .f-tile.haslogo{background:rgba(239,231,216,.97);}
.full .f-tile .detail-img{max-width:78%;max-height:72%;width:auto;height:auto;object-fit:contain;display:block;}
.photo .ini{font-family:var(--sans);font-weight:700;font-size:54px;color:rgba(239,231,216,.92);letter-spacing:.02em;}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.5) 100%);}
/* Fill-frame cards carry real colour photos and white-background logos, so the tile's
   own dark gradient isn't underneath the label any more. Deepen and lengthen the scrim
   for these cards only — monogram cards already sit on a dark gradient and don't need it.
   Sits above .fill-img (z-index 0) and below .label / .reveal (z-index 2). */
.photo.fill::after{
  z-index:1;
  background:linear-gradient(180deg,
    transparent 26%,
    rgba(0,0,0,0.10) 44%,
    rgba(0,0,0,0.40) 64%,
    rgba(0,0,0,0.70) 82%,
    rgba(0,0,0,0.88) 100%);
}
/* ── Free (basic) listings: compact monogram tile, ~half height ──────────────
   Type scales down to match — a 54px monogram would collide with the label at
   150px. The expanded card is unaffected (layout() fixes its height). */
.card.compact .photo{padding-bottom:36px;}
.card.compact .photo .ini{font-size:31px;}
.card.compact .label{bottom:12px;}
.card.compact .label .cat{font-size:8.5px;letter-spacing:.15em;margin-bottom:3px;}
.card.compact .label .nm{font-size:16px;line-height:1.1;}
.card.compact .reveal{padding:14px 14px;}
.card.compact .reveal .r-nm{font-size:17px;}
.card.compact .reveal .r-cat{margin:4px 0 6px;}
.card.compact .reveal .r-desc{-webkit-line-clamp:2;font-size:12px;line-height:1.45;}
.card.compact .reveal .r-more{margin-top:8px;font-size:9px;}
/* category tile colours */
.tile-legal,.tile-design{background:linear-gradient(155deg,var(--terra) 0%,#241d17 130%);}
.tile-accounting,.tile-banking{background:linear-gradient(155deg,var(--ochre) 0%,#241d17 130%);}
.tile-unbs{background:linear-gradient(155deg,var(--moss) 0%,#20160f 130%);}
.tile-insurance{background:linear-gradient(155deg,var(--stone) 0%,#20160f 130%);}
.tile-ip{background:linear-gradient(155deg,var(--terra-d) 0%,#20160f 130%);}
.tile-digital{background:linear-gradient(155deg,#33312c 0%,#0f0d0a 130%);}
.label{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;color:var(--paper);}
/* Over a photo, a two-line name and the gold Verified badge can ride above the deepest
   part of the scrim — a soft shadow keeps them legible without darkening the image. */
.photo.fill + .label{text-shadow:0 1px 3px rgba(0,0,0,.55);}
.label .cat{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(239,231,216,.82);margin-bottom:5px;}
.label .nm{font-family:var(--display);font-size:22px;font-weight:400;line-height:1.08;}
.vbadge{display:inline-flex;align-items:center;gap:5px;font-family:var(--sans);font-size:8px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ochre);margin-bottom:6px;}
.vbadge svg{width:10px;height:10px;}
.reveal{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 18px;opacity:0;transition:opacity .45s cubic-bezier(.25,.46,.45,.94);background:rgba(20,17,13,.34);-webkit-backdrop-filter:blur(9px) saturate(1.05);backdrop-filter:blur(9px) saturate(1.05);}
.reveal > *{transform:translateY(10px);transition:transform .55s cubic-bezier(.25,.46,.45,.94);}
.reveal > *:nth-child(2){transition-delay:.05s;} .reveal > *:nth-child(3){transition-delay:.10s;} .reveal > *:nth-child(4){transition-delay:.15s;} .reveal > *:nth-child(5){transition-delay:.20s;}
.card:hover .reveal{opacity:1;}
.card:hover .reveal > *{transform:translateY(0);}
.card.expanded .reveal{opacity:0;pointer-events:none;}
.reveal .r-nm{font-family:var(--display);font-size:23px;color:var(--paper);line-height:1.08;}
.reveal .r-cat{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ochre);margin:6px 0 8px;}
.reveal .r-desc{font-size:13px;line-height:1.5;color:rgba(239,231,216,.94);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
.reveal .r-more{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--paper);margin-top:12px;opacity:.85;}
.full{position:absolute;inset:0;z-index:4;display:none;grid-template-columns:42% 58%;background:var(--paper-2);}
.card.expanded .full{display:grid;}
.full .f-tile{position:relative;display:flex;align-items:center;justify-content:center;}
.full .f-tile .ini{font-family:var(--sans);font-weight:700;font-size:60px;color:rgba(239,231,216,.92);}
.full .f-body{padding:26px 26px 22px;display:flex;flex-direction:column;overflow:auto;}
.full .fx{position:absolute;top:12px;right:12px;z-index:6;width:30px;height:30px;border-radius:50%;border:none;background:rgba(239,231,216,.92);color:var(--ink);font-size:18px;cursor:pointer;line-height:1;}
.full .f-cat{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:5px;}
.full .f-nm{font-family:var(--display);font-size:27px;font-weight:400;line-height:1.06;color:var(--ink);}
.full .f-desc{font-size:14px;line-height:1.6;color:rgba(26,26,26,.62);margin:12px 0 0;}
.full .f-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:16px;}
/* contact buttons */
.card-action-btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--body);font-size:12px;font-weight:500;padding:8px 13px;border-radius:6px;border:1px solid rgba(26,26,26,.10);background:transparent;color:var(--ink);transition:all .3s;text-decoration:none;cursor:pointer;}
.card-action-btn:hover{border-color:rgba(26,26,26,.22);background:rgba(26,26,26,.03);}
.card-action-btn svg{width:15px;height:15px;flex-shrink:0;}
.card-action-btn.wa{border-color:rgba(37,211,102,.3);color:#128C7E;}
.card-action-btn.wa:hover{background:rgba(37,211,102,.08);border-color:rgba(37,211,102,.5);}
/* category label colours */
.label-legal,.label-design{color:var(--terra);} .label-accounting,.label-banking{color:var(--ochre);} .label-unbs{color:var(--moss);} .label-insurance{color:var(--stone);} .label-ip{color:var(--terra-d);} .label-digital{color:var(--ink);}
.load-more{display:block;margin:34px auto 0;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:var(--paper-2);border:1px solid var(--line-l);padding:12px 26px;cursor:pointer;border-radius:0 0 14px 0;}
.load-more:hover{border-color:var(--terra);color:var(--terra);}
@media(max-width:640px){.full{grid-template-columns:1fr;}.full .f-tile{min-height:160px;}}

/* ============================================================
   DIRECTORY v2 — featured display cards + filter sidebar + list
   ============================================================ */
.dx-wrap{max-width:1180px;margin:0 auto;padding:8px 0 10px;}
.dx-sec-eyebrow{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--terra);margin:0 0 14px;display:flex;align-items:center;gap:9px;}
.dx-sec-eyebrow .dia{width:9px;height:9px;transform:rotate(45deg);background:var(--terra);display:inline-block;}
/* featured display cards */
.dx-featured{margin-bottom:36px;}
.dx-fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
.dx-fcard{background:#fff;border:1px solid var(--line-l);border-radius:0 0 22px 0;overflow:hidden;transition:box-shadow .2s,transform .2s;}
.dx-fcard:hover{box-shadow:0 12px 34px rgba(26,26,26,.09);transform:translateY(-2px);}
.dx-fhero{position:relative;height:158px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.dx-fhero img{width:100%;height:100%;}
.dx-fhero .mono-lg{font-family:var(--display);font-style:italic;font-size:58px;color:rgba(239,231,216,.92);}
.dx-fhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(16,14,11,.28));pointer-events:none;}
.dx-ftag{position:absolute;top:0;left:0;z-index:2;background:var(--ochre);color:#3a2606;font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:5px 12px;}
.dx-fbody{padding:15px 18px 16px;}
.dx-frow{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.dx-logo{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;}
.dx-logo img{width:100%;height:100%;object-fit:contain;background:#fff;}
.dx-logo .mono{font-family:var(--sans);font-weight:700;font-size:16px;color:#fff;}
.dx-fname{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.05;color:var(--ink);}
.dx-cat{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:4px;display:inline-block;}
.dx-vpill{display:inline-flex;align-items:center;gap:4px;font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--terra-d);background:rgba(200,83,31,.09);border:1px solid rgba(200,83,31,.25);padding:2px 8px;border-radius:20px;}
.dx-vpill svg{width:9px;height:9px;}
.dx-fdesc{font-size:13px;color:var(--muted);line-height:1.5;margin:10px 0 14px;}
.dx-cta{display:flex;gap:8px;flex-wrap:wrap;}
.dx-abtn{flex:1;min-width:96px;text-align:center;font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:9px 10px;border:1px solid var(--line);cursor:pointer;background:var(--paper);color:var(--ink);text-decoration:none;transition:all .15s;}
.dx-abtn:hover{border-color:var(--terra);color:var(--terra);}
.dx-abtn.pri{background:var(--terra);color:#fff;border-color:var(--terra);}
.dx-abtn.pri:hover{background:var(--terra-d);color:#fff;}
/* toolbar */
.dx-toolbar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.dx-search{flex:1;min-width:220px;position:relative;}
.dx-search input{width:100%;box-sizing:border-box;background:#fff;border:1px solid var(--line-l);padding:12px 14px 12px 42px;font-size:14px;font-family:var(--body);color:var(--ink);border-radius:0 0 14px 0;}
.dx-search input:focus{outline:none;border-color:var(--terra);}
.dx-search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:16px;height:16px;opacity:.4;}
/* two-column body */
.dx-body{display:grid;grid-template-columns:206px 1fr;gap:28px;align-items:start;}
.dx-side{align-self:start;position:sticky;top:14px;}
.dx-side h4{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;padding-bottom:9px;border-bottom:1px solid var(--line-l);}
.dx-cat-row{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;padding:8px 10px;cursor:pointer;border-left:2px solid transparent;color:#3d3a35;transition:background .12s;}
.dx-cat-row:hover{background:rgba(26,26,26,.03);}
.dx-cat-row.on{background:rgba(200,83,31,.07);border-left-color:var(--terra);color:var(--terra-d);font-weight:600;}
.dx-cat-row .n{font-size:11px;color:var(--stone);}
.dx-cat-row .lbl{display:flex;align-items:center;gap:9px;}
.dx-cat-row .dot{width:7px;height:7px;transform:rotate(45deg);flex:none;}
.dx-vtoggle{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);margin-top:14px;padding-top:13px;border-top:1px solid var(--line-l);cursor:pointer;}
.dx-vtoggle input{accent-color:var(--terra);width:15px;height:15px;}
.dx-reset{display:block;margin-top:14px;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);background:none;border:none;cursor:pointer;padding:2px 0;}
.dx-reset:hover{color:var(--terra);}
/* list */
.dx-listhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.dx-cnt{font-size:12.5px;color:var(--stone);}
.dx-sort{font-family:var(--body);font-size:12.5px;padding:7px 10px;border:1px solid var(--line-l);background:#fff;color:var(--ink);}
.dx-row{display:flex;align-items:center;gap:15px;background:#fff;border:1px solid var(--line-l);padding:14px 16px;margin-bottom:9px;border-radius:0 0 14px 0;transition:border-color .15s,box-shadow .15s;}
.dx-row:hover{border-color:var(--line);box-shadow:0 4px 16px rgba(26,26,26,.05);}
.dx-row .rlogo{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;}
.dx-row .rlogo img{width:100%;height:100%;object-fit:contain;background:#fff;}
.dx-row .rlogo .mono{font-family:var(--sans);font-weight:700;font-size:15px;color:#fff;}
.dx-row .mid{flex:1;min-width:0;}
.dx-row .nm{font-family:var(--display);font-size:18px;font-weight:600;line-height:1.1;color:var(--ink);display:flex;align-items:center;gap:9px;flex-wrap:wrap;}

<!-- ============================================================
     BRAND PAGE LOADER — rotating V6 mark, fades on load.
     Inline + first-in-body so it paints in frame 1, before the deferred
     site-chrome.js runs. That also masks the FOUC where the eyebrow .v6-mark
     briefly renders un-sized (its width is set by deferred CSS). Self-removing,
     with a failsafe so it can never trap the visitor. Reusable as-is on any page.
     ============================================================ -->
<style>
  #fs-preload{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;
    background:#1A1A1A;transition:opacity .42s ease;}
  #fs-preload.gone{opacity:0;pointer-events:none;}
  #fs-preload svg{width:56px;height:56px;transform-origin:50% 50%;animation:fsplspin 2.6s linear infinite;}
  @keyframes fsplspin{to{transform:rotate(360deg);}}
  @media(prefers-reduced-motion:reduce){#fs-preload svg{animation:none;}}
</style>
<div id="fs-preload" role="status" aria-label="Loading">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <polygon points="50,8 57,50 50,92 43,50" fill="#C8531F" opacity="0.9"/>
    <polygon points="50,8 57,50 50,92 43,50" fill="#C9923A" opacity="0.85" transform="rotate(72,50,50)"/>
    <polygon points="50,8 57,50 50,92 43,50" fill="#8AAB5C" opacity="0.82" transform="rotate(144,50,50)"/>
    <polygon points="50,8 57,50 50,92 43,50" fill="#3D4A2E" opacity="0.85" transform="rotate(216,50,50)"/>
    <polygon points="50,8 57,50 50,92 43,50" fill="#777770" opacity="0.78" transform="rotate(288,50,50)"/>
    <circle cx="50" cy="50" r="4.5" fill="#EFE7D8"/><circle cx="50" cy="50" r="2" fill="#1A1A1A"/>
  </svg>
</div>
<script>
  (function(){
    var p=document.getElementById('fs-preload'); if(!p) return;
    var done=false;
    function hide(){ if(done) return; done=true; p.classList.add('gone');
      setTimeout(function(){ p.parentNode && p.parentNode.removeChild(p); },480); }
    if(document.readyState==='complete') hide();
    else window.addEventListener('load', hide, {once:true});
    setTimeout(hide, 2600);   // failsafe — never trap the visitor on a slow asset
  })();
</script>

function featuredCta(p){
  var w = normUrl(p.website), h = '';
  if (p.email)      h += '<a class="dx-abtn pri" href="mailto:' + esc(p.email) + '" data-pid="' + p.id + '" data-ctx="email">Contact</a>';
  else if (p.phone) h += '<a class="dx-abtn pri" href="https://wa.me/' + formatWhatsApp(p.phone) + '" target="_blank" rel="noopener" data-pid="' + p.id + '" data-ctx="whatsapp">Message</a>';
  if (w)            h += '<a class="dx-abtn" href="' + esc(w) + '" target="_blank" rel="noopener" data-pid="' + p.id + '" data-ctx="website">Website ↗</a>';
  return h || '<span style="font-size:12px;color:var(--stone);font-style:italic">No contact listed</span>';
}

function featuredCard(p){
  var cat = catOf(p);
  return '<div class="dx-fcard">' + heroBox(p) +
    '<div class="dx-fbody"><div class="dx-frow">' + logoBox(p, 'dx-logo') +
      '<div><div class="dx-fname">' + esc(p.company_name || '—') + '</div>' +
      '<span class="dx-cat" style="color:' + catColor(cat) + '">' + catLabel(cat) + '</span></div></div>' +
      '<div>' + VPILL + '</div>' +
      (p.description ? '<div class="dx-fdesc">' + esc(p.description) + '</div>' : '<div class="dx-fdesc"></div>') +
      '<div class="dx-cta">' + featuredCta(p) + '</div></div></div>';
}

function providerRow(p){
  var cat = catOf(p);
  var meta = '<span style="color:' + catColor(cat) + ';font-weight:600">' + catLabel(cat).toUpperCase() + '</span>';
  var dom = domainOf(p.website); if (dom) meta += ' · ' + esc(dom);
  return '<div class="dx-row">' + logoBox(p, 'rlogo') +
    '<div class="mid"><div class="nm">' + esc(p.company_name || '—') + (isVerified(p) ? ' ' + VTICK : '') + '</div>' +
      (p.description ? '<div class="desc">' + esc(p.description) + '</div>' : '') +
      '<div class="meta">' + meta + '</div></div>' +
    '<div class="acts">' + rowActions(p) + '</div></div>';
}

function renderSidebar(){
  var counts = {}, total = 0;
  ALL.forEach(function(p){ counts[catOf(p)] = (counts[catOf(p)]||0) + 1; total++; });
  var rows = '<div class="dx-cat-row' + (activeFilter==='all'?' on':'') + '" data-cat="all"><span class="lbl"><i class="dot" style="background:var(--stone)"></i>All providers</span><span class="n">' + total + '</span></div>';
  ALLOWED_CATS.forEach(function(c){
    if (!counts[c]) return;
    rows += '<div class="dx-cat-row' + (activeFilter===c?' on':'') + '" data-cat="' + c + '"><span class="lbl"><i class="dot" style="background:' + catColor(c) + '"></i>' + catLabel(c) + '</span><span class="n">' + counts[c] + '</span></div>';
  });
  rows += '<label class="dx-vtoggle"><input type="checkbox" id="dxVerified"' + (verifiedOnly?' checked':'') + '> Verified only</label>';
  rows += '<button class="dx-reset" id="dxReset">Reset filters</button>';
  dxSide.innerHTML = rows;
}

function render(){
  renderSidebar();
  var feat = ALL.filter(function(p){ return isFeatured(p) && matches(p); });
  dxFeatured.innerHTML = feat.length
    ? '<div class="dx-sec-eyebrow"><i class="dia"></i>Featured providers</div><div class="dx-fgrid">' + feat.map(featuredCard).join('') + '</div>'
    : '';
  var list = ALL.filter(function(p){ return !isFeatured(p) && matches(p) && (!verifiedOnly || isVerified(p)); });
  list.sort(function(a, b){
    if (sortMode === 'name') return (a.company_name||'').localeCompare(b.company_name||'');
    var av = isVerified(a) ? 0 : 1, bv = isVerified(b) ? 0 : 1;
    if (av !== bv) return av - bv;
    return (a.company_name||'').localeCompare(b.company_name||'');
  });
  dxCount.textContent = list.length + (list.length === 1 ? ' provider' : ' providers');
  dxList.innerHTML = list.length
    ? list.map(providerRow).join('')
    : '<div class="dx-empty2">No providers match that yet. <a href="apply-directory.html">Apply to be listed &rarr;</a></div>';
}

function logImpression(pid, ctx){
  if (!pid) return;
  try {
    fetch(SUPABASE_URL + '/rest/v1/provider_impressions', { method:'POST',
      headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY, 'Content-Type':'application/json', 'Prefer':'return=minimal' },
      body: JSON.stringify({ provider_id: pid, surface: 'directory', context: String(ctx||'').slice(0,80), clicked: true }) });
  } catch (e) {}
}

/* delegated: sidebar category clicks + reset + contact-click impression logging */
document.addEventListener('click', function(e){
  var catRow = e.target.closest('.dx-cat-row');
  if (catRow){ activeFilter = catRow.getAttribute('data-cat'); render(); return; }
  if (e.target && e.target.id === 'dxReset'){ activeFilter='all'; verifiedOnly=false; searchQ=''; if(dxSearchEl) dxSearchEl.value=''; render(); return; }
  var cbtn = e.target.closest('[data-pid]');
  if (cbtn) logImpression(cbtn.getAttribute('data-pid'), cbtn.getAttribute('data-ctx'));   // no preventDefault — let the link open
});
document.addEventListener('change', function(e){
  if (e.target && e.target.id === 'dxVerified'){ verifiedOnly = e.target.checked; render(); }
});
if (dxSearchEl) dxSearchEl.addEventListener('input', function(){ searchQ = this.value.trim().toLowerCase(); render(); });
if (dxSortEl)   dxSortEl.addEventListener('change', function(){ sortMode = this.value; render(); });

async function loadDirectory(){
  try {
    var url = SUPABASE_URL + '/rest/v1/directory_providers?select=' + SELECT +
      '&status=eq.active&order=featured.desc.nullslast,company_name.asc.nullslast&limit=300';
    var res = await fetch(url, { headers: { 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY, 'Accept':'application/json' } });
    ALL = res.ok ? await res.json() : [];
  } catch (err){ console.error('Failed to load directory:', err); ALL = []; }
  render();
}
loadDirectory();
</script>
