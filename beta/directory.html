<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resource Directory — The Founder's Sprint</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Curated service providers for East African founders — legal, accounting, design, digital, and more. Vetted by The Founder's Sprint.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Josefin+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== TOKENS — matching beta site ===== */
:root {
  --radius-card: 0 0 24px 0;
  --paper:   #efe7d8;
  --paper-2: #f6f0e3;
  --ink:     #1a1a1a;
  --ink-2:   #0f0d0a;
  --terra:   #c8531f;
  --terra-d: #9a3e15;
  --ochre:   #c9923a;
  --sage:    #8aab5c;
  --moss:    #3d4a2e;
  --stone:   #777770;
  --line-d:  rgba(239,231,216,0.10);
  --line-l:  rgba(26,26,26,0.10);

  --display: "Cormorant Garamond", serif;
  --sans:    "Josefin Sans", sans-serif;
  --body:    "Inter", system-ui, sans-serif;
  --mono:    "JetBrains Mono", monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--body);
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  line-height: 1.55; font-size: 17px;
}
a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }

/* ===== GRAIN ===== */
.noise {
  position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.07;
  background-image: url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27300%27%20height%3D%27300%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.85%27%20numOctaves%3D%273%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200.95%200%200%200%200%200.92%200%200%200%200%200.85%200%200%200%201%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27300%27%20height%3D%27300%27%20filter%3D%27url%28%23n%29%27%2F%3E%3C%2Fsvg%3E");
}

/* ===== LAYOUT ===== */
.shell { width: 100%; max-width: 1440px; margin: 0 auto; padding: 0 56px; }
section, footer, nav { position: relative; z-index: 2; }

/* ===== V6 LOGO MARK (inline for eyebrows) ===== */
.v6-mark { display: inline-block; width: 14px; height: 14px; vertical-align: middle; flex-shrink: 0; }

/* ===== TYPE ===== */
.eyebrow {
  font-family: var(--sans); font-size: 10px; font-weight: 700;
  letter-spacing: 0.32em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 8px;
}
.h-section {
  font-family: var(--display); font-style: italic; font-weight: 400;
  font-size: clamp(34px, 4.4vw, 56px);
  line-height: 1.04; letter-spacing: -0.008em; text-wrap: balance;
}
.h-sub {
  font-family: var(--body); font-size: 17px; line-height: 1.55;
  max-width: 56ch; text-wrap: pretty;
}

/* ===== NAV ===== */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  padding: 22px 56px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(15,13,10,0.88);
  border-bottom: 1px solid var(--line-d);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.nav .brand { display: flex; align-items: center; gap: 12px; color: var(--paper); }
.nav .brand svg { width: 26px; height: 26px; }
.nav .brand .wm {
  font-family: var(--sans); font-weight: 700; font-size: 12px;
  letter-spacing: 0.30em; text-transform: uppercase;
}
.nav .links { display: flex; justify-content: center; gap: 36px; }
.nav .links a {
  font-family: var(--mono); font-size: 10.5px;
  letter-spacing: 0.20em; text-transform: uppercase;
  color: rgba(239,231,216,0.55);
  text-decoration: none; transition: color 200ms;
}
.nav .links a:hover { color: var(--paper); }
.nav .links a.active { color: var(--terra); }
.nav .cta { justify-self: end; display: flex; gap: 14px; align-items: center; }
.nav .cta .ghost {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(239,231,216,0.55); text-decoration: none;
  transition: color 200ms;
}
.nav .cta .ghost:hover { color: var(--paper); }
.nav .cta .nav-pill {
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  letter-spacing: 0.20em; text-transform: uppercase;
  padding: 10px 22px; background: var(--terra);
  color: var(--paper); border: none; cursor: pointer;
  text-decoration: none; transition: filter 200ms, transform 200ms;
}
.nav .cta .nav-pill:hover { filter: brightness(1.1); transform: translateY(-1px); }

/* ===== HERO — now rendered by the shared site-chrome module (.fsx-hero); width via this page's own .shell (1440) ===== */
.btn-apply {
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  letter-spacing: 4px; text-transform: uppercase;
  padding: 17px 32px; display: inline-block;
  background: var(--terra); color: var(--paper);
  transition: opacity 0.2s, transform 0.15s;
}
.btn-apply:hover { opacity: 0.88; }

/* ===== CATEGORY FILTER ===== */
.filter-section { padding: 48px 0 0; }
.filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.filter-btn {
  font-family: var(--sans); font-size: 10px; font-weight: 600;
  letter-spacing: 0.15em; text-transform: uppercase;
  padding: 9px 16px; cursor: pointer;
  background: transparent; border: 1px solid var(--line-l);
  color: var(--stone); transition: all 200ms;
}
.filter-btn:hover { border-color: var(--terra); color: var(--terra); }
.filter-btn.active { background: var(--terra); color: var(--paper); border-color: var(--terra); }

/* ===== DIRECTORY — cascading board (matches the mentors board) ===== */
.directory-section { padding: 40px 0 100px; }
.board{position:relative;width:100%;}
.empty,.empty-state{text-align:center;padding:70px 20px;color:var(--stone);}
.empty-state h3{font-family:var(--display);font-size:28px;font-weight:300;color:var(--ink);margin-bottom:12px;}
.empty-state p{font-size:15px;color:var(--stone);max-width:400px;margin:0 auto 24px;}
.card{position:absolute;top:0;left:0;border-radius:var(--radius-card);overflow:hidden;cursor:pointer;background:var(--paper-2);
  box-shadow:0 1px 2px rgba(26,26,26,.06);
  transition:transform .55s cubic-bezier(.4,.9,.3,1),width .55s cubic-bezier(.4,.9,.3,1),height .55s cubic-bezier(.4,.9,.3,1),box-shadow .4s ease;
  will-change:transform,width,height;}
.card:hover{box-shadow:0 16px 40px rgba(26,26,26,.12);}
.card.expanded{box-shadow:0 26px 60px rgba(26,26,26,.20);cursor:default;z-index:3;}
.photo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;}
.photo .logo{max-width:62%;max-height:44%;object-fit:contain;background:rgba(239,231,216,.94);padding:14px 16px;border-radius:8px;position:relative;z-index:1;}
.photo .ini{font-family:var(--sans);font-weight:700;font-size:54px;color:rgba(239,231,216,.92);letter-spacing:.02em;}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.5) 100%);}
/* category tile colours */
.tile-legal,.tile-design{background:linear-gradient(155deg,var(--terra) 0%,#241d17 130%);}
.tile-accounting,.tile-banking{background:linear-gradient(155deg,var(--ochre) 0%,#241d17 130%);}
.tile-unbs{background:linear-gradient(155deg,var(--moss) 0%,#20160f 130%);}
.tile-insurance{background:linear-gradient(155deg,var(--stone) 0%,#20160f 130%);}
.tile-ip{background:linear-gradient(155deg,var(--terra-d) 0%,#20160f 130%);}
.tile-digital{background:linear-gradient(155deg,#33312c 0%,#0f0d0a 130%);}
.label{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;color:var(--paper);}
.label .cat{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(239,231,216,.82);margin-bottom:5px;}
.label .nm{font-family:var(--display);font-size:22px;font-weight:400;line-height:1.08;}
.vbadge{display:inline-flex;align-items:center;gap:5px;font-family:var(--sans);font-size:8px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ochre);margin-bottom:6px;}
.vbadge svg{width:10px;height:10px;}
.reveal{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 18px;opacity:0;transition:opacity .45s cubic-bezier(.25,.46,.45,.94);background:rgba(20,17,13,.34);-webkit-backdrop-filter:blur(9px) saturate(1.05);backdrop-filter:blur(9px) saturate(1.05);}
.reveal > *{transform:translateY(10px);transition:transform .55s cubic-bezier(.25,.46,.45,.94);}
.reveal > *:nth-child(2){transition-delay:.05s;} .reveal > *:nth-child(3){transition-delay:.10s;} .reveal > *:nth-child(4){transition-delay:.15s;} .reveal > *:nth-child(5){transition-delay:.20s;}
.card:hover .reveal{opacity:1;}
.card:hover .reveal > *{transform:translateY(0);}
.card.expanded .reveal{opacity:0;pointer-events:none;}
.reveal .r-nm{font-family:var(--display);font-size:23px;color:var(--paper);line-height:1.08;}
.reveal .r-cat{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ochre);margin:6px 0 8px;}
.reveal .r-desc{font-size:13px;line-height:1.5;color:rgba(239,231,216,.94);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
.reveal .r-more{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--paper);margin-top:12px;opacity:.85;}
.full{position:absolute;inset:0;z-index:4;display:none;grid-template-columns:42% 58%;background:var(--paper-2);}
.card.expanded .full{display:grid;}
.full .f-tile{position:relative;display:flex;align-items:center;justify-content:center;}
.full .f-tile .logo{max-width:72%;max-height:54%;object-fit:contain;background:rgba(239,231,216,.94);padding:16px 18px;border-radius:8px;}
.full .f-tile .ini{font-family:var(--sans);font-weight:700;font-size:60px;color:rgba(239,231,216,.92);}
.full .f-body{padding:26px 26px 22px;display:flex;flex-direction:column;overflow:auto;}
.full .fx{position:absolute;top:12px;right:12px;z-index:6;width:30px;height:30px;border-radius:50%;border:none;background:rgba(239,231,216,.92);color:var(--ink);font-size:18px;cursor:pointer;line-height:1;}
.full .f-cat{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:5px;}
.full .f-nm{font-family:var(--display);font-size:27px;font-weight:400;line-height:1.06;color:var(--ink);}
.full .f-desc{font-size:14px;line-height:1.6;color:rgba(26,26,26,.62);margin:12px 0 0;}
.full .f-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:16px;}
/* contact buttons */
.card-action-btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--body);font-size:12px;font-weight:500;padding:8px 13px;border-radius:6px;border:1px solid rgba(26,26,26,.10);background:transparent;color:var(--ink);transition:all .3s;text-decoration:none;cursor:pointer;}
.card-action-btn:hover{border-color:rgba(26,26,26,.22);background:rgba(26,26,26,.03);}
.card-action-btn svg{width:15px;height:15px;flex-shrink:0;}
.card-action-btn.wa{border-color:rgba(37,211,102,.3);color:#128C7E;}
.card-action-btn.wa:hover{background:rgba(37,211,102,.08);border-color:rgba(37,211,102,.5);}
/* category label colours */
.label-legal,.label-design{color:var(--terra);} .label-accounting,.label-banking{color:var(--ochre);} .label-unbs{color:var(--moss);} .label-insurance{color:var(--stone);} .label-ip{color:var(--terra-d);} .label-digital{color:var(--ink);}
.load-more{display:block;margin:34px auto 0;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:var(--paper-2);border:1px solid var(--line-l);padding:12px 26px;cursor:pointer;border-radius:0 0 14px 0;}
.load-more:hover{border-color:var(--terra);color:var(--terra);}
@media(max-width:640px){.full{grid-template-columns:1fr;}.full .f-tile{min-height:160px;}}

/* ===== FOOTER — universal (matches beta site) ===== */
footer {
  background: #08070a; color: rgba(239,231,216,0.55);
  padding: 56px 56px 36px; border-top: 1px solid var(--line-d);
  position: relative; overflow: hidden;
}
.footer-constellation-bg {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 500px 300px at 10% 50%, rgba(200,83,31,0.18) 0%, transparent 65%),
    radial-gradient(ellipse 400px 250px at 50% 20%, rgba(201,146,58,0.12) 0%, transparent 65%),
    radial-gradient(ellipse 450px 280px at 90% 60%, rgba(138,171,92,0.10) 0%, transparent 65%),
    radial-gradient(ellipse 350px 220px at 30% 85%, rgba(61,74,46,0.14) 0%, transparent 65%),
    radial-gradient(ellipse 300px 200px at 70% 40%, rgba(200,83,31,0.06) 0%, transparent 70%);
}
.footer-constellation-bg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
footer .row {
  max-width: 1440px; margin: 0 auto;
  display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
  gap: 36px; position: relative; z-index: 1;
}
footer .col h6 {
  font-family: var(--sans); font-size: 10px; font-weight: 700;
  letter-spacing: 0.28em; text-transform: uppercase;
  color: rgba(239,231,216,0.4); margin-bottom: 14px;
}
footer .col ul {
  list-style: none; display: flex; flex-direction: column; gap: 10px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
  padding: 0; margin: 0;
}
footer .col a { color: rgba(239,231,216,0.65); text-decoration: none; transition: color 200ms; }
footer .col a:hover { color: #efe7d8; }
footer a { text-decoration: none; }
footer .brand-col .blurb {
  font-family: var(--body); font-size: 12.5px; color: rgba(239,231,216,0.55);
  max-width: 40ch; line-height: 1.55;
}
footer .footer-social { display: flex; gap: 14px; margin-top: 16px; }
footer .footer-social a { color: rgba(239,231,216,0.4); transition: color 200ms; }
footer .footer-social a:hover { color: var(--paper); }
footer .footer-social svg { display: block; }
footer .bottom {
  max-width: 1440px; margin: 48px auto 0; padding-top: 24px;
  border-top: 1px solid var(--line-d);
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(239,231,216,0.35);
  position: relative; z-index: 1;
}

/* ===== MOBILE ===== */
@media (max-width: 1100px) {
  .shell { padding: 0 32px; }
  .nav { padding: 18px 32px; }
  footer { padding: 48px 32px 32px; }
  footer .row { gap: 24px; }
}
@media (max-width: 860px) {
  footer .row { grid-template-columns: 2fr 1fr 1fr; }
  footer .col:nth-child(4),
  footer .col:nth-child(5) { grid-row: 2; }
}
@media (max-width: 700px) {
  .nav { padding: 16px 20px; }
  .nav .brand .wm { font-size: 10px; letter-spacing: 0.22em; }
  .shell { padding: 0 24px; }
  .filter-bar { gap: 6px; }
  .filter-btn { padding: 8px 12px; font-size: 9px; }
  footer { padding: 40px 24px 28px; }
  footer .row { grid-template-columns: 1fr 1fr; }
  footer .brand-col { grid-column: 1 / -1; }
  footer .bottom { flex-direction: column; gap: 10px; }
}
@media (max-width: 480px) {
  footer .row { grid-template-columns: 1fr; }
}
</style>
</head>

<!-- NAV -->
<div id="fs-nav"></div>

<!-- HERO with constellation -->

  <div class="hero-constellation" aria-hidden="true">
    <svg viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice" style="opacity:0.45">

      <circle cx="1000" cy="50" r="1" fill="#efe7d8" opacity="0.12"/>
    </svg>
  </div>
  <div class="shell">
    <span class="eyebrow section-eb">
      <svg class="v6-mark" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,8 57,50 50,92 43,50" fill="currentColor" opacity="0.85"/><polygon points="50,8 57,50 50,92 43,50" fill="currentColor" opacity="0.65" transform="rotate(72 50 50)"/><polygon points="50,8 57,50 50,92 43,50" fill="currentColor" opacity="0.55" transform="rotate(144 50 50)"/><polygon points="50,8 57,50 50,92 43,50" fill="currentColor" opacity="0.65" transform="rotate(216 50 50)"/><polygon points="50,8 57,50 50,92 43,50" fill="currentColor" opacity="0.55" transform="rotate(288 50 50)"/><circle cx="50" cy="50" r="4.5" fill="currentColor" opacity="0.8"/></svg>
      Resource Directory
    </span>
    <h2 class="h-section">Trusted providers for<br><em>ambitious founders</em></h2>
    <p class="h-sub" style="margin-top:18px;color:rgba(239,231,216,0.62);">Every provider here is vetted by The Founder's Sprint. We only list services we'd put in front of our own cohort founders.</p>
    <div class="hero-rule"></div>
    <p class="tag">Build with direction.</p>
    <div class="cta-row">
      <a class="btn-apply" href="apply-directory.html">Become a listed provider <span style="margin-left:6px;">&rarr;</span></a>
    </div>
  </div>
</section>

<!-- Programme sponsors -->
<div data-sponsors style="border-bottom:1px solid rgba(26,26,26,0.1);overflow:hidden"></div>

<!-- CATEGORY FILTER -->
<section class="filter-section">
  <div class="shell">
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-cat="all">All</button>
      <button class="filter-btn" data-cat="legal">Legal</button>
      <button class="filter-btn" data-cat="accounting">Accounting</button>
      <button class="filter-btn" data-cat="design">Design</button>

<script>

var board = document.getElementById('board');

/* V6 diamond mark SVG for featured badge */
var V6_MINI = '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,8 57,50 50,92 43,50" fill="currentColor" opacity="0.85"/><polygon points="50,8 57,50 50,92 43,50" fill="currentColor" opacity="0.65" transform="rotate(72 50 50)"/><polygon points="50,8 57,50 50,92 43,50" fill="currentColor" opacity="0.55" transform="rotate(144 50 50)"/><polygon points="50,8 57,50 50,92 43,50" fill="currentColor" opacity="0.65" transform="rotate(216 50 50)"/><polygon points="50,8 57,50 50,92 43,50" fill="currentColor" opacity="0.55" transform="rotate(288 50 50)"/><circle cx="50" cy="50" r="4.5" fill="currentColor" opacity="0.8"/></svg>';

/* WhatsApp SVG icon */
var WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>';

var MAIL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>';

/* Phone SVG icon */
var PHONE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>';

/* Website SVG icon */
var LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function getInitials(name) {
  if (!name) return '?';
  var parts = name.trim().split(/\s+/);
  if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
  return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
}

function formatWhatsApp(phone) {
  if (!phone) return '';
  return phone.replace(/[\s\-\(\)]/g, '').replace(/^\+/, '');
}

/* ===== Cascading board (matches mentors.html) ===== */
var PAGE_SIZE = 24;
var ALLOWED_CATS = ['legal','accounting','design','unbs','banking','insurance','ip','digital'];
var SELECT = 'company_name,category,description,contact_name,email,phone,website,logo_url,tier,featured,banner_tagline,status';
var verifiedCache = [];
var ITEMS = [];          // providers currently on the board (verified + loaded basic)
var basicLoaded = 0;     // basic rows appended so far (for the active filter)
var basicTotal = 0;      // total basic rows for the active filter
var expandedIdx = -1;

function tileClass(cat){ return 'tile-' + (ALLOWED_CATS.indexOf(cat) >= 0 ? cat : 'digital'); }
function catLabel(cat){ return esc(CATEGORY_LABELS[cat] || cat); }
function cardH(p){ var d = (p.description||'').length; return Math.max(240, Math.min(390, 250 + Math.round(d/4))); }

function tileInner(p){
  return p.logo_url
    ? '<img class="logo" src="' + esc(p.logo_url) + '" alt="' + esc(p.company_name) + ' logo" loading="lazy">'
    : '<span class="ini">' + getInitials(p.company_name) + '</span>';
}

function contactActions(p){
  var h = '';
  var phone = p.phone ? String(p.phone) : '';
  if (phone) h += '<a class="card-action-btn wa" href="https://wa.me/' + formatWhatsApp(phone) + '" target="_blank" rel="noopener">' + WA_ICON + ' WhatsApp</a>';
  if (p.email) h += '<a class="card-action-btn" href="mailto:' + esc(p.email) + '">' + MAIL_ICON + ' Email</a>';
  if (phone) h += '<a class="card-action-btn" href="tel:' + esc(phone.replace(/\s/g,'')) + '">' + PHONE_ICON + ' Call</a>';
  if (p.website) {
    var u = String(p.website).trim();
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    if (/^https?:\/\//i.test(u)) h += '<a class="card-action-btn" href="' + esc(u) + '" target="_blank" rel="noopener">' + LINK_ICON + ' Website</a>';
  }
  return h || '<span style="font-size:12px;color:var(--stone);font-style:italic">No contact listed</span>';
}

function boardCard(p, i){
  var cat = ALLOWED_CATS.indexOf(p.category) >= 0 ? p.category : 'digital';
  var name = esc(p.company_name || '—');
  var lbl = catLabel(cat);
  var verified = p.tier === 'verified';
  var vbadge = verified ? '<span class="vbadge">' + V6_MINI + ' Verified</span>' : '';
  return '<div class="card" data-i="' + i + '" data-h="' + cardH(p) + '">' +
      '<div class="photo ' + tileClass(cat) + '">' + tileInner(p) + '</div>' +
      '<div class="label">' + vbadge + '<div class="cat">' + lbl + '</div><div class="nm">' + name + '</div></div>' +
      '<div class="reveal">' + (verified ? '<span class="vbadge">' + V6_MINI + ' Verified Partner</span>' : '') +
        '<div class="r-nm">' + name + '</div><div class="r-cat">' + lbl + '</div>' +
        (p.description ? '<div class="r-desc">' + esc(p.description) + '</div>' : '') +
        '<div class="r-more">Click for contact →</div></div>' +
      '<div class="full"><button class="fx" aria-label="Close">×</button>' +
        '<div class="f-tile ' + tileClass(cat) + '">' + tileInner(p) + '</div>' +
        '<div class="f-body"><div class="f-cat label-' + cat + '">' + (verified ? '✦ Verified Partner · ' : '') + lbl + '</div>' +
          '<div class="f-nm">' + name + '</div>' +
          (p.description ? '<div class="f-desc">' + esc(p.description) + '</div>' : '') +
          '<div class="f-actions">' + contactActions(p) + '</div>' +
        '</div></div>' +
    '</div>';
}

/* Masonry engine — absolute placement + FLIP-style transitions */
function layout(){
  var W = board.clientWidth;
  var COLW = 264, gap = 18;
  var cols = Math.max(1, Math.floor((W + gap) / (COLW + gap)));
  var colW = (W - gap * (cols - 1)) / cols;
  var colH = new Array(cols).fill(0);
  var cards = board.querySelectorAll('.card');
  for (var k = 0; k < cards.length; k++){
    var card = cards[k];
    var gi = +card.dataset.i;
    var isExp = (gi === expandedIdx);
    var span = isExp ? Math.min(2, cols) : 1;
    // find the column with min height that can host `span` consecutive columns
    var bestCol = 0, bestTop = Infinity;
    for (var c = 0; c <= cols - span; c++){
      var top = 0;
      for (var q = 0; q < span; q++) top = Math.max(top, colH[c+q]);
      if (top < bestTop){ bestTop = top; bestCol = c; }
    }
    var w = colW * span + gap * (span - 1);
    var h = isExp ? (span === 1 ? 560 : 470) : (+card.dataset.h || 300);
    var x = bestCol * (colW + gap);
    var y = bestTop;
    card.style.width = w + 'px';
    card.style.height = h + 'px';
    card.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    card.classList.toggle('expanded', isExp);
    for (var q2 = 0; q2 < span; q2++) colH[bestCol+q2] = y + h + gap;
  }
  board.style.height = Math.max.apply(null, colH.concat([0])) + 'px';
}

function setExpanded(gi){ expandedIdx = (expandedIdx === gi ? -1 : gi); layout(); }

function moreHtml(){
  if (basicLoaded >= basicTotal) return '';
  return '<button class="load-more" id="loadMoreBtn">Load more providers</button>';
}

function render(){
  expandedIdx = -1;
  if (!ITEMS.length){
    board.style.height = 'auto';
    board.innerHTML = '<div class="empty-state"><h3>No providers listed yet</h3><p>' +
      (activeFilter === 'all'
        ? 'Be the first to join our curated directory of service providers for East African founders.'
        : 'No providers in this category yet. Check back soon or apply to be the first.') +
      '</p><a class="btn-apply" href="apply-directory.html">Apply to be listed &rarr;</a></div>';
    dirMore.innerHTML = '';
    return;
  }
  board.innerHTML = ITEMS.map(function(p, i){ return boardCard(p, i); }).join('');
  dirMore.innerHTML = moreHtml();
  var lm = document.getElementById('loadMoreBtn');
  if (lm) lm.addEventListener('click', loadMore);
  layout();
}

function basicQueryUrl(page){
  var url = SUPABASE_URL + '/rest/v1/directory_providers?select=' + SELECT +
    '&status=eq.active&or=(tier.eq.basic,tier.is.null)&order=company_name.asc.nullslast';
  if (activeFilter !== 'all' && ALLOWED_CATS.indexOf(activeFilter) !== -1){
    url += '&category=eq.' + encodeURIComponent(activeFilter);
  }
  return url;
}

async function fetchBasicPage(page){
  var start = page * PAGE_SIZE, end = start + PAGE_SIZE - 1;
  var res = await fetch(basicQueryUrl(page), {
    headers: {
      'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Accept': 'application/json', 'Range-Unit': 'items', 'Range': start + '-' + end, 'Prefer': 'count=exact'
    }
  });
  if (!res.ok && res.status !== 206) throw new Error('HTTP ' + res.status);
  var rows = await res.json();
  var cr = res.headers.get('Content-Range') || '';
  var slash = cr.indexOf('/');
  basicTotal = slash !== -1 ? (parseInt(cr.slice(slash + 1), 10) || 0) : rows.length;
  return rows;
}

async function loadMore(){
  var btn = document.getElementById('loadMoreBtn');
  if (btn){ btn.disabled = true; btn.textContent = 'Loading…'; }
  try {
    var page = Math.floor(basicLoaded / PAGE_SIZE);
    var rows = await fetchBasicPage(page);
    basicLoaded += rows.length;
    ITEMS = ITEMS.concat(rows);
    render();
  } catch (err){ console.error('Load more failed:', err); if (btn){ btn.disabled = false; btn.textContent = 'Load more providers'; } }
}

async function loadVerified(){
  try {
    var url = SUPABASE_URL + '/rest/v1/directory_providers?select=' + SELECT +
      '&status=eq.active&tier=eq.verified&order=featured.desc.nullslast,company_name.asc&limit=100';
    var res = await fetch(url, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Accept': 'application/json' } });
    if (res.ok) verifiedCache = await res.json();
  } catch (err){ console.error('Failed to load verified partners:', err); }
}

async function reload(){
  var verified = activeFilter === 'all' ? verifiedCache : verifiedCache.filter(function(p){ return p.category === activeFilter; });
  basicLoaded = 0; basicTotal = 0;
  var basic = [];
  try { basic = await fetchBasicPage(0); basicLoaded = basic.length; }
  catch (err){ console.error('Failed to load listings:', err); }
  ITEMS = verified.concat(basic);
  render();
}

function applyFilter(cat){
  activeFilter = cat;
  var btns = filterBar.querySelectorAll('.filter-btn');
  for (var i = 0; i < btns.length; i++){ btns[i].classList.toggle('active', btns[i].getAttribute('data-cat') === cat); }
  reload();
}

filterBar.addEventListener('click', function(e){
  var btn = e.target.closest('.filter-btn');
  if (btn) applyFilter(btn.getAttribute('data-cat'));
});

/* Board interactions — bound once */
board.addEventListener('click', function(e){
  var card = e.target.closest('.card');
  if (!card) return;
  if (e.target.closest('a')) return;            // let contact links work
  if (e.target.closest('.fx')){ e.stopPropagation(); setExpanded(-1); return; }
  if (card.classList.contains('expanded')) return;
  setExpanded(+card.dataset.i);
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && expandedIdx !== -1) setExpanded(-1); });
var rt;
window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(layout, 120); });

async function loadDirectory(){
  await loadVerified();
  await reload();
}
loadDirectory();
</script>
