<style>
  :root{
    --ink:#1A1A1A; --ink-2:#0f0d0a; --paper:#EFE7D8; --paper-2:#F6F0E3; --paper-deep:#E6DCC7;
    --terra:#C8531F; --terra-deep:#9A3E16; --ochre:#C9923A; --moss:#3D4A2E; --sage:#8AAB5C; --stone:#777770;
    --muted:#5A564F; --line:rgba(26,26,26,0.12);
    --sans:'Josefin Sans',system-ui,sans-serif; --display:'Cormorant Garamond',Georgia,serif;
    --body:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
    --disc:#8AAB5C;       /* discipline accent — Investment Readiness = sage */
    --disc-deep:#3E5827;  /* deep green — light-bg accents, buttons, borders */
    --radius-card:0 0 24px 0;

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;}

  .fsx-hero .hero-photo{position:absolute;inset:0;z-index:0;background-position:center;background-size:cover;background-repeat:no-repeat;filter:grayscale(1) contrast(1.04) brightness(.62);opacity:.72;}
  .fsx-hero .hero-scrim{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(15,13,10,.42),rgba(15,13,10,.58) 60%,rgba(15,13,10,.9)),linear-gradient(90deg,rgba(15,13,10,.78),rgba(15,13,10,.24) 55%,transparent);}

  /* ===== INTRO ===== */
  .intro{padding:84px 0 40px;}
  .intro .lede{font-family:var(--display);font-size:clamp(24px,3.4vw,34px);line-height:1.4;font-weight:300;max-width:880px;}
  .intro .lede em{color:var(--disc-deep);font-style:italic;}
  .intro .by{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:22px;}
  .intro p.body{max-width:760px;margin-top:18px;color:#2a2824;}

  /* ===== DATA / FUNDING CHART ===== */
  .data{background:var(--ink-2);color:var(--paper);padding:64px 0;margin-top:56px;}
  .data .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--disc);}
  .data h2{font-family:var(--sans);font-weight:400;font-size:clamp(26px,3.6vw,38px);letter-spacing:-.022em;margin:10px 0 6px;}
  .data .sub{color:rgba(239,231,216,.66);max-width:660px;}
  .chart{margin:34px 0 10px;}
  .bar-row{display:grid;grid-template-columns:120px 1fr 84px;align-items:center;gap:14px;margin:11px 0;}
  .bar-row .lab{font-family:var(--sans);font-size:13px;font-weight:500;color:rgba(239,231,216,.9);text-align:right;}
  .bar-track{height:24px;background:rgba(239,231,216,.05);position:relative;}
  .bar-fill{display:block;height:100%;background:var(--disc);transform:scaleX(1);transform-origin:left;}
  .bar-row.ug .bar-fill{background:var(--terra);box-shadow:0 0 16px 1px rgba(200,83,31,.55);}
  .chart.animate .bar-fill{transform:scaleX(0);animation:barGrow 1.05s cubic-bezier(.2,.75,.25,1) both;}
  .chart.animate .bar-row:nth-child(1) .bar-fill{animation-delay:.05s;}
  .chart.animate .bar-row:nth-child(2) .bar-fill{animation-delay:.17s;}
  .chart.animate .bar-row:nth-child(3) .bar-fill{animation-delay:.29s;}
  .chart.animate .bar-row:nth-child(4) .bar-fill{animation-delay:.41s;}
  .chart.animate .bar-row.ug .bar-fill{animation:barGrow 1.05s cubic-bezier(.2,.75,.25,1) .75s both, ugGlow 2.4s ease-in-out 2s infinite;}
  .bar-row.ug .lab{color:var(--terra);font-weight:700;}
  .bar-row .val{font-family:var(--mono);font-size:12px;color:rgba(239,231,216,.8);}
  .bar-row.ug .val{color:var(--terra);font-weight:700;}
  @keyframes barGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  @keyframes ugGlow{0%,100%{box-shadow:0 0 14px 1px rgba(200,83,31,.5);}50%{box-shadow:0 0 24px 3px rgba(200,83,31,.92);}}
  @media (prefers-reduced-motion:reduce){.bar-fill,.chart.animate .bar-fill{transform:scaleX(1)!important;animation:none!important;}}
  .src{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:rgba(239,231,216,.45);margin-top:20px;}
  .src a{color:rgba(239,231,216,.6);}
  .data .takeaway{font-family:var(--display);font-size:22px;font-style:italic;line-height:1.5;color:var(--paper);max-width:720px;margin-top:30px;border-left:2px solid var(--disc);padding-left:20px;}

  /* ===== STAT STRIP ===== */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:56px 0 8px;}
  .stat{background:var(--paper-2);padding:26px 22px;}
  .stat .n{font-family:var(--display);font-size:38px;font-weight:400;color:var(--disc-deep);line-height:1;min-height:104px;display:flex;align-items:center;}
  .stat .k{font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:10px;}
  .stat .d{font-size:13px;color:#2a2824;margin-top:6px;line-height:1.5;}
  .pie{position:relative;width:104px;height:104px;}
  .pie svg{width:100%;height:100%;display:block;transform:rotate(-90deg);}
  .pie .trk{fill:none;stroke:rgba(26,26,26,.10);stroke-width:9;}
  .pie .arc{fill:none;stroke:var(--disc);stroke-width:9;stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:var(--off);}
  .pie .pn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;font-weight:400;color:var(--disc-deep);}
  .has-js .stats .stat{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease;}
  .has-js .pie .arc{stroke-dashoffset:264;}
  .stats.animate .stat{opacity:1;transform:none;}
  .stats.animate .stat:nth-child(2){transition-delay:.12s;}
  .stats.animate .stat:nth-child(3){transition-delay:.24s;}
  .animate .pie .arc{stroke-dashoffset:var(--off);transition:stroke-dashoffset 1.15s cubic-bezier(.2,.75,.25,1);}
  .pie-sm{width:66px;height:66px;flex-shrink:0;}
  .pie-sm .pn{font-size:17px;}
  .mstat{display:flex;align-items:center;gap:16px;margin:2px 0 24px;padding:14px 18px;background:var(--paper-2);border-left:3px solid var(--disc);border-radius:0;}
  .mstat .mbig{font-family:var(--display);font-size:32px;font-weight:400;color:var(--disc-deep);line-height:1;flex-shrink:0;white-space:nowrap;}
  .mstat .mtxt{font-size:13.5px;color:#33302b;line-height:1.5;}
  .mstat .msrc{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--muted);margin-top:3px;}
  .has-js .mstat{opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease;}
  .mstat.animate{opacity:1;transform:none;}
  @media (prefers-reduced-motion:reduce){
    .has-js .stats .stat,.has-js .mstat{opacity:1;transform:none;}
    .has-js .pie .arc{stroke-dashoffset:var(--off);}
  }

  /* ===== SUB-CATEGORY SECTIONS ===== */
  .disc-sec{padding:78px 0;}
  .disc-sec .inner{display:grid;grid-template-columns:0.82fr 1.18fr;gap:48px;align-items:center;}
  .disc-sec.alt .inner{grid-template-columns:1.18fr 0.82fr;}
  .disc-sec.alt .copy{order:2;}
  .disc-sec.alt .visual{order:1;}
  .sec-eb{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--disc-deep);}
  .sec-eb .num{color:var(--stone);}
  .disc-sec h3{font-family:var(--sans);font-weight:400;font-size:clamp(25px,3.4vw,36px);letter-spacing:-.022em;margin:10px 0 0;line-height:1.14;}
  .disc-sec .stand{font-family:var(--display);font-style:italic;font-size:19px;color:var(--muted);margin:8px 0 22px;max-width:46ch;}
  .spec{padding:18px 0;border-top:1px solid var(--line);}
  .spec:first-of-type{border-top:none;}
  .spec .sn{font-family:var(--sans);font-weight:600;font-size:16px;letter-spacing:.01em;display:flex;align-items:baseline;gap:10px;}
  .spec .sn::before{content:"";width:7px;height:7px;background:var(--disc);border-radius:0 0 4px 0;flex-shrink:0;transform:translateY(-1px);}
  .spec p{margin:7px 0 0 17px;font-size:14.5px;color:#33302b;line-height:1.6;}
  .go{display:inline-flex;align-items:center;gap:8px;margin-top:26px;font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper);background:var(--disc-deep);padding:13px 22px;text-decoration:none;border-radius:0 0 14px 0;transition:opacity .2s;}
  .go:hover{opacity:.9;}

  .ph-img{width:100%;aspect-ratio:4/5;position:relative;overflow:hidden;border:1px solid rgba(26,26,26,0.14);border-radius:0 0 24px 0;box-shadow:0 16px 34px -20px rgba(26,26,26,0.42);
    background-color:var(--paper-deep);background-position:center;background-size:cover;background-repeat:no-repeat;
    filter:grayscale(1) contrast(1.06) brightness(.98);}
  .constel{position:relative;margin:14px auto 0;max-width:none;}
  .constel svg{width:100%;height:auto;display:block;overflow:visible;}
  .constel .orbit{transform:none;}
  .constel .spin{animation:constelSpin 60s linear infinite;transform-box:fill-box;transform-origin:center;}
  .constel .lbl{animation:constelLbl 60s linear infinite;transform-box:fill-box;transform-origin:center;}
  .constel .glow{animation:constelPulse 5s ease-in-out infinite;}
  @keyframes constelSpin{to{transform:rotate(360deg);}}
  @keyframes constelLbl{to{transform:rotate(-360deg);}}
  @keyframes constelPulse{0%,100%{opacity:.12;}50%{opacity:.22;}}
  @media (prefers-reduced-motion:reduce){.constel .spin,.constel .lbl,.constel .glow{animation:none;}}

  /* ===== PARALLAX ===== */
  .parallax{position:relative;min-height:340px;display:flex;align-items:center;justify-content:center;text-align:center;
    background:var(--ink-2) center/cover no-repeat;background-attachment:fixed;}
  .parallax::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,13,10,.62),rgba(15,13,10,.78));}
  .parallax .pq{position:relative;z-index:1;max-width:760px;padding:48px 24px;}
  .parallax .pq q{font-family:var(--display);font-style:italic;font-size:clamp(24px,3.4vw,34px);line-height:1.4;color:var(--paper);quotes:none;}
  .parallax .pq .who{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--disc);margin-top:18px;}

  /* ===== COACH BAND ===== */
  .coach{background:var(--ink-2);color:var(--paper);padding:78px 0;}
  .coach .inner{display:grid;grid-template-columns:340px 1fr;gap:56px;align-items:center;}
  .coach .portrait{position:relative;}
  .coach .portrait svg{width:100%;height:auto;display:block;}
  .coach .portrait image{filter:grayscale(1) contrast(1.05) brightness(1.06);}
  .coach .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--disc);}
  .coach h3{font-family:var(--sans);font-weight:400;font-size:clamp(28px,3.8vw,40px);letter-spacing:-.022em;margin:8px 0 2px;}
  .coach .role{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(239,231,216,.6);}
  .coach .bio{font-family:var(--display);font-size:21px;line-height:1.55;font-weight:300;color:rgba(239,231,216,.92);margin-top:22px;max-width:60ch;}
  .coach .bio em{color:var(--disc);font-style:italic;}

  /* ===== FINAL CTA ===== */
  .end{padding:84px 0;text-align:center;}
  .end .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--disc-deep);}
  .end h2{font-family:var(--sans);font-weight:300;font-size:clamp(30px,4.6vw,50px);letter-spacing:-.022em;margin:12px 0 8px;}
  .end p{max-width:560px;margin:0 auto 28px;color:var(--muted);}
  .cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn{font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:15px 28px;text-decoration:none;border-radius:0 0 16px 0;}
  .btn-fill{background:var(--disc-deep);color:var(--paper);} .btn-fill:hover{opacity:.9;}
  .btn-ghost{background:none;color:var(--ink);border:1px solid var(--line);} .btn-ghost:hover{border-color:var(--ink);}

  @media (max-width:860px){
    .disc-sec .inner,.disc-sec.alt .inner,.coach .inner{grid-template-columns:1fr;gap:30px;}
    .disc-sec.alt .copy{order:1;} .disc-sec.alt .visual{order:2;}
    .coach .portrait{max-width:300px;margin:0 auto;}
    .stats{grid-template-columns:1fr;}
    .bar-row{grid-template-columns:92px 1fr 70px;gap:10px;}
    .parallax{background-attachment:scroll;}
  }
</style>

    <h1 class="h-section">Investment <em>Readiness</em></h1>
    <p class="h-sub" style="margin-top:18px;color:rgba(239,231,216,0.66);">Most founders chase investors long before they're ready to be chosen. This is the discipline of being <em>impossible to overlook</em> — a story that lands, a data room that holds up, and a raise built to close.</p>

<!-- ===== INTRO ===== -->
<section class="intro">
  <div class="shell">
    <nav aria-label="Breadcrumb" style="font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><a href="/beta/index.html" style="color:var(--muted);text-decoration:none">Home</a><span style="color:var(--stone)">›</span><a href="/beta/index.html#method" style="color:var(--muted);text-decoration:none">Method</a><span style="color:var(--stone)">›</span><span aria-current="page" style="color:var(--disc-deep)">Investment Readiness</span></nav>
    <p class="lede">Capital in this market is scarce, concentrated, and cautious. Investment readiness is how a Ugandan founder stops hoping to be discovered and starts being impossible to <em>overlook</em>.</p>
    <p class="by">— from the Investment Readiness discipline, led by Joseph Kalema</p>
    <p class="body">Investors don't fund potential; they fund proof, packaged so they can act on it. In a market where most early capital pools in four other countries and pattern-matches to founders who look familiar, a Ugandan founder has to be sharper than the average pitch in Lagos or Nairobi — a narrative that lands in seconds, a data room that survives scrutiny, and a funding plan that knows exactly which cheque to chase. This page breaks down the nine specialties of that craft, and why each one earns its place in a serious founder's toolkit.</p>
  </div>
</section>

<!-- ===== DATA / FUNDING GAP ===== -->
<section class="data">
  <div class="shell">
    <div class="eyebrow">Why this matters · where the money goes</div>
    <h2>The money exists — it just rarely comes looking for you.</h2>
    <p class="sub">In 2024, African startups raised about US$2.2&nbsp;billion. Almost none reached Uganda — and most never left four countries.</p>
    <div class="chart" data-reveal role="img" aria-label="2024 startup funding by country: Kenya $638M, Nigeria $410M, Egypt $400M, South Africa $394M, Uganda $19M.">
      <div class="bar-row"><span class="lab">Kenya</span><span class="bar-track"><span class="bar-fill" style="width:100%"></span></span><span class="val">$638M</span></div>
      <div class="bar-row"><span class="lab">Nigeria</span><span class="bar-track"><span class="bar-fill" style="width:64%"></span></span><span class="val">$410M</span></div>
      <div class="bar-row"><span class="lab">Egypt</span><span class="bar-track"><span class="bar-fill" style="width:63%"></span></span><span class="val">$400M</span></div>
      <div class="bar-row"><span class="lab">South Africa</span><span class="bar-track"><span class="bar-fill" style="width:62%"></span></span><span class="val">$394M</span></div>
      <div class="bar-row ug"><span class="lab">Uganda</span><span class="bar-track"><span class="bar-fill" style="width:3%"></span></span><span class="val">$19M</span></div>
    </div>
    <div class="src">Source: Africa: The Big Deal, 2024 full-year funding (startups raising ≥ US$100k), reported via Technext &amp; Techweez, Jan 2025.</div>
    <p class="takeaway">Uganda raised roughly <em>one thirty-third</em> of Kenya's total, and <em>84%</em> of all African funding stayed inside the "Big Four". The capital won't wander to you. Investment readiness is how a Ugandan founder becomes the exception an investor can't talk themselves out of — clear, credible, and ready to close.</p>
  </div>
</section>

      <div class="k">To founders from abroad</div>
      <div class="d">In East Africa, roughly nine in ten disclosed startup dollars went to companies with at least one foreign founder. Local founders are overlooked by default — a flawless raise changes the default.</div>

<!-- ===== SUB-CATEGORY 1 — PITCH CRAFT ===== -->

<script>
  (function(){
    var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    function fmt(el,v){ var d=el.dataset.dec?+el.dataset.dec:0; return (el.dataset.prefix||'')+v.toFixed(d)+(el.dataset.suffix||''); }
    function countUp(el){
      var target=parseFloat(el.dataset.count); if(isNaN(target)) return;
      var t0=null, dur=1150;
      function step(ts){ if(!t0)t0=ts; var p=Math.min((ts-t0)/dur,1), e=1-Math.pow(1-p,3); el.textContent=fmt(el,target*e); if(p<1) requestAnimationFrame(step); else el.textContent=fmt(el,target); }
      requestAnimationFrame(step);
    }
    function fire(el){
      el.classList.add('animate');
      el.querySelectorAll('[data-count]').forEach(rm ? function(e){ e.textContent=fmt(e,parseFloat(e.dataset.count)); } : countUp);
    }
    var items = document.querySelectorAll('[data-reveal]');
    if(rm || !('IntersectionObserver' in window)){ items.forEach(fire); return; }
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if(e.isIntersecting){ fire(e.target); io.unobserve(e.target); } });
    },{threshold:0.3});
    items.forEach(function(el){ io.observe(el); });
  })();
</script>
<script>
  (function(){
    var svg=document.querySelector('.portrait svg'); if(!svg) return;
    var spokeG=svg.querySelector('.c-spokes'), nodeG=svg.querySelector('.c-nodes');
    if(!spokeG||!nodeG) return;
    var NS='http://www.w3.org/2000/svg', CX=170, CY=165, N=9, RX=130, RY=124, PULSE=0.25;
    var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    spokeG.innerHTML=''; nodeG.innerHTML='';
    var lines=[], dots=[];
    for(var k=0;k<N;k++){
      var ln=document.createElementNS(NS,'line'); ln.setAttribute('x1',CX); ln.setAttribute('y1',CY); spokeG.appendChild(ln); lines.push(ln);
      var c=document.createElementNS(NS,'circle'); c.setAttribute('r','3'); nodeG.appendChild(c); dots.push(c);
    }
    var BASE=-Math.PI/2;
    function place(t){
      var rot=rm?0:t*0.00008;
      for(var i=0;i<N;i++){
        var a=BASE+i*(Math.PI*2/N)+rot;
        var rf=1+(rm?0:PULSE*Math.sin(t*0.0011+i*0.7));
        var x=CX+Math.cos(a)*RX*rf, y=CY+Math.sin(a)*RY*rf;
        lines[i].setAttribute('x2',x.toFixed(1)); lines[i].setAttribute('y2',y.toFixed(1));
        dots[i].setAttribute('cx',x.toFixed(1)); dots[i].setAttribute('cy',y.toFixed(1));
      }
      if(!rm) requestAnimationFrame(place);
    }
    if(rm) place(0); else requestAnimationFrame(place);
  })();
</script>
